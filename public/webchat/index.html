<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股助手 - A 股信息助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a1a2e; color: #fff; padding: 14px 20px; font-size: 17px; }
    header small { opacity: .6; font-size: 12px; margin-left: 8px; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
    .user { align-self: flex-end; background: #3b82f6; color: #fff; }
    .bot { align-self: flex-start; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .bot.error { background: #fef2f2; color: #b91c1c; }
    #bar { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #e5e7eb; }
    #input { flex: 1; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
    #send { background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; font-size: 14px; }
    #send:disabled { opacity: .5; }
    .hint { align-self: center; color: #9ca3af; font-size: 12px; }
  </style>
</head>
<body>
  <header>📊 股助手<small>A 股信息助手 · 仅供参考，不构成投资建议</small></header>
  <div id="chat">
    <div class="msg bot">你好！我是股助手。试试这些：
• 600519 现在多少钱？
• 我买了 300750，帮我加自选
• 我的自选股今天怎么样？</div>
  </div>
  <div id="bar">
    <input id="input" placeholder="输入消息，回车发送…" autofocus />
    <button id="send">发送</button>
  </div>
  <script>
    // MVP 阶段用本地生成的 userId 标识会话，后续接入真实账号体系
    const userId = localStorage.getItem('cnstockbot_uid') ||
      (() => { const id = 'web_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('cnstockbot_uid', id); return id; })();

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg(text, 'user');
      sendBtn.disabled = true;
      const pending = addMsg('思考中…', 'bot');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, message: text }),
        });
        const data = await res.json();
        pending.textContent = data.reply || data.error || '（无回复）';
        if (data.error) pending.classList.add('error');
      } catch (e) {
        pending.textContent = '请求失败：' + e.message;
        pending.classList.add('error');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = send;
    input.onkeydown = (e) => { if (e.key === 'Enter') send(); };

    // 轮询离线通知（收盘日报等推送）
    setInterval(async () => {
      try {
        const res = await fetch('/api/inbox?userId=' + encodeURIComponent(userId));
        const { messages } = await res.json();
        for (const m of messages || []) addMsg(m, 'bot');
      } catch { /* 忽略轮询错误 */ }
    }, 30000);
  </script>
</body>
</html>
