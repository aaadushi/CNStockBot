<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股助手 - A 股信息助手</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <style>
    body { height: 100vh; display: flex; flex-direction: column; }
    .chat-wrap {
      flex: 1; max-width: 720px; width: 100%; margin: 0 auto;
      display: flex; flex-direction: column; min-height: 0; padding: 20px;
      gap: 12px;
    }
    #chat {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
      padding: 4px 2px;
    }
    .msg {
      max-width: 78%; padding: 12px 16px; font-size: 14px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word;
    }
    .user {
      align-self: flex-end; background: var(--accent); color: #fff;
      border-radius: 18px 18px 6px 18px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, .25);
    }
    .bot {
      align-self: flex-start; background: var(--card);
      border: 0; border-radius: 18px 18px 18px 6px;
      box-shadow: var(--shadow-md);
    }
    .bot.error { background: var(--up-soft); color: var(--up); }
    /* 加粗渲染（REQ-chat-md-bold）：仅对 strong 微调，不动布局 */
    .msg strong { font-weight: 600; }

    /* 欢迎建议 chip */
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; }
    .chip {
      font-size: 13px; color: var(--text-2); background: var(--card);
      border: 0; border-radius: 999px; padding: 8px 16px;
      box-shadow: var(--shadow-sm);
      cursor: pointer; transition: all 200ms ease-in-out;
    }
    .chip:hover {
      color: var(--accent); background: var(--accent-soft);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, .2);
    }
    .chip:active { transform: scale(.97); }

    /* 思考中三点动画 */
    .thinking::after {
      content: ''; display: inline-block; width: 1.2em; text-align: left;
      animation: dots 1.2s steps(4) infinite;
    }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

    /* 输入区 */
    #bar {
      display: flex; gap: 10px; background: var(--card);
      border: 0; border-radius: 20px;
      box-shadow: var(--shadow-lg); padding: 10px;
    }
    #input { border: none; box-shadow: none !important; background: transparent; }
    #input:focus { box-shadow: none !important; }
    #send { border-radius: 14px; }

    /* 反馈弹窗（REQ-Feedback-Admin）：复用 auth-overlay/auth-card 样式，DOM 全 JS 构建 */
    #feedback-modal .auth-card { max-width: 420px; }
    #feedback-text {
      min-height: 120px; resize: vertical; line-height: 1.6;
      font-family: var(--font);
    }
    #feedback-success { text-align: center; padding: 8px 0; }
    #feedback-success .ok-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); font-size: 22px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="inner">
      <span class="brand">📊 股助手</span>
      <span class="sub">仅供参考，不构成投资建议</span>
      <span class="spacer"></span>
      <a class="nav" href="/stocks">自选股</a>
      <a class="nav" href="/market">涨跌榜</a>
      <a class="nav" href="/funds">基金</a>
      <a class="nav" href="/news">快讯</a>
      <a class="nav" href="/sectors">板块</a>
      <a class="nav" href="/overseas">外盘</a>
      <a class="nav" href="/scanner">扫描</a>
      <a class="nav" href="/backtest">回测</a>
      <a class="nav" href="/inbox">消息</a>
      <a class="nav active" href="/webchat">聊天</a>
      <button class="nav btn-ghost" id="feedback-btn">反馈</button>
      <button class="nav btn-ghost" id="logout-btn" style="display:none">退出</button>
    </div>
  </header>

  <div class="chat-wrap">
    <div id="chat">
      <div class="msg bot">你好！我是股助手。试试这些：</div>
      <div class="suggestions" id="suggestions">
        <button class="chip">600519 现在多少钱？</button>
        <button class="chip">我买了 300750，帮我加自选</button>
        <button class="chip">我的自选股今天怎么样？</button>
      </div>
    </div>
    <div id="bar">
      <input id="input" class="input" placeholder="输入消息，回车发送…" autofocus />
      <button id="send" class="btn btn-primary">发送</button>
    </div>
  </div>

  <script src="/shared/compat.js"></script>
  <script src="/shared/auth.js"></script>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const logoutBtn = document.getElementById('logout-btn');

    // >>> md-bold-renderer:start (REQ-chat-md-bold)
    // 极简 Markdown 加粗渲染：只识别成对的 **...**，bold 段创建 <strong>
    // （内容走 textContent，不解析内部任何标记）；其余字符一律按字面文本
    // 节点插入；不成对的 ** 原样保留。全程不使用 innerHTML 拼接不可信文本。
    // 只用到 Chrome 83 可用的 API（安卓壳 WebView 下限）。
    function renderMdBold(text) {
      const frag = document.createDocumentFragment();
      const s = String(text == null ? '' : text);
      let i = 0;
      while (i < s.length) {
        const open = s.indexOf('**', i);
        if (open === -1) { frag.appendChild(document.createTextNode(s.slice(i))); break; }
        const close = s.indexOf('**', open + 2);
        if (close === -1) { frag.appendChild(document.createTextNode(s.slice(i))); break; }
        if (open > i) frag.appendChild(document.createTextNode(s.slice(i, open)));
        const inner = s.slice(open + 2, close);
        if (inner) {
          const strong = document.createElement('strong');
          strong.textContent = inner;
          frag.appendChild(strong);
        } else {
          frag.appendChild(document.createTextNode('****'));
        }
        i = close + 2;
      }
      return frag;
    }

    // 替换气泡文本：先清空（等价清除旧内容），再追加渲染结果。
    function setMsgText(el, text) {
      el.textContent = '';
      el.appendChild(renderMdBold(text));
    }
    // <<< md-bold-renderer:end

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      setMsgText(div, text);
      const sg = document.getElementById('suggestions');
      if (sg && (cls === 'user')) sg.remove();
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function updateLogout() {
      logoutBtn.style.display = CNStockAuth.isLoggedIn() ? 'inline-block' : 'none';
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg(text, 'user');
      sendBtn.disabled = true;
      const pending = addMsg('思考中', 'bot');
      pending.classList.add('thinking');
      try {
        const res = await CNStockAuth.apiFetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        pending.classList.remove('thinking');
        setMsgText(pending, data.reply || data.error || '（无回复）');
        if (data.error) pending.classList.add('error');
      } catch (e) {
        pending.classList.remove('thinking');
        setMsgText(pending, '请求失败：' + e.message);
        pending.classList.add('error');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = send;
    input.onkeydown = (e) => { if (e.key === 'Enter') send(); };
    document.getElementById('suggestions').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      input.value = chip.textContent;
      send();
    });

    logoutBtn.onclick = () => {
      CNStockAuth.logout();
      updateLogout();
      addMsg('已退出登录', 'bot');
    };

    // >>> feedback-modal:start (REQ-Feedback-Admin)
    // 意见反馈弹窗：复用 auth-overlay/auth-card 样式；DOM 全 createElement 构建、
    // 用户可见文本一律 textContent（不拼 innerHTML，红线同全站）；只用 Chrome 83 API。
    const feedbackBtn = document.getElementById('feedback-btn');
    let feedbackOverlay = null;
    let feedbackFormBox = null;
    let feedbackSuccessBox = null;
    let feedbackTextEl = null;
    let feedbackContactEl = null;
    let feedbackErrEl = null;
    let feedbackSubmitBtn = null;

    function fbEl(tag, cls, txt) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      // 与 setMsgText 同红线：用户可见文本一律文本节点，不走 textContent 直赋
      if (txt !== undefined) e.appendChild(document.createTextNode(String(txt)));
      return e;
    }

    function buildFeedbackModal() {
      if (feedbackOverlay) return;
      const overlay = fbEl('div', 'auth-overlay');
      overlay.id = 'feedback-modal';
      overlay.hidden = true;
      const card = fbEl('div', 'auth-card');

      feedbackFormBox = fbEl('div');
      feedbackFormBox.style.display = 'flex';
      feedbackFormBox.style.flexDirection = 'column';
      feedbackFormBox.style.gap = '16px';
      feedbackFormBox.appendChild(fbEl('h2', null, '意见反馈'));
      feedbackFormBox.appendChild(fbEl('p', null, '说说你遇到的问题或建议；联系方式选填，方便我们回访。'));
      feedbackTextEl = fbEl('textarea', 'input');
      feedbackTextEl.id = 'feedback-text';
      feedbackTextEl.placeholder = '反馈内容（必填，2000 字以内）';
      feedbackContactEl = fbEl('input', 'input');
      feedbackContactEl.id = 'feedback-contact';
      feedbackContactEl.placeholder = '联系方式（选填，微信 / QQ / 邮箱等）';
      feedbackErrEl = fbEl('div', 'error');
      feedbackSubmitBtn = fbEl('button', 'btn btn-primary', '提交');
      const cancelBtn = fbEl('button', 'btn btn-ghost', '取消');
      feedbackFormBox.appendChild(feedbackTextEl);
      feedbackFormBox.appendChild(feedbackContactEl);
      feedbackFormBox.appendChild(feedbackErrEl);
      feedbackFormBox.appendChild(feedbackSubmitBtn);
      feedbackFormBox.appendChild(cancelBtn);
      card.appendChild(feedbackFormBox);

      feedbackSuccessBox = fbEl('div', null);
      feedbackSuccessBox.id = 'feedback-success';
      feedbackSuccessBox.hidden = true;
      feedbackSuccessBox.appendChild(fbEl('div', 'ok-icon', '✓'));
      feedbackSuccessBox.appendChild(fbEl('p', null, '感谢反馈，我们已收到你的意见。'));
      const closeBtn = fbEl('button', 'btn btn-primary', '关闭');
      feedbackSuccessBox.appendChild(closeBtn);
      card.appendChild(feedbackSuccessBox);

      overlay.appendChild(card);
      document.body.appendChild(overlay);
      feedbackOverlay = overlay;

      const close = () => {
        overlay.hidden = true;
        feedbackFormBox.hidden = false;
        feedbackSuccessBox.hidden = true;
        feedbackTextEl.value = '';
        feedbackContactEl.value = '';
        feedbackErrEl.textContent = '';
        feedbackSubmitBtn.disabled = false;
      };
      cancelBtn.onclick = close;
      closeBtn.onclick = close;

      feedbackSubmitBtn.onclick = async () => {
        const text = feedbackTextEl.value.trim();
        if (!text) {
          feedbackErrEl.textContent = '请填写反馈内容';
          return;
        }
        if (text.length > 2000) {
          feedbackErrEl.textContent = '反馈内容不能超过 2000 字';
          return;
        }
        feedbackSubmitBtn.disabled = true;
        feedbackErrEl.textContent = '';
        try {
          // 未登录时 apiFetch 会先弹登录浮层，登录成功后续跑本请求
          const res = await CNStockAuth.apiFetch('/api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, contact: feedbackContactEl.value.trim() }),
          });
          const data = await res.json();
          if (!res.ok) {
            feedbackErrEl.textContent = data.error || ('提交失败（HTTP ' + res.status + '）');
            feedbackSubmitBtn.disabled = false;
            return;
          }
          feedbackFormBox.hidden = true;
          feedbackSuccessBox.hidden = false;
        } catch (e) {
          feedbackErrEl.textContent = '网络错误：' + e.message;
          feedbackSubmitBtn.disabled = false;
        }
      };
    }

    feedbackBtn.onclick = () => {
      buildFeedbackModal();
      feedbackOverlay.hidden = false;
      feedbackTextEl.focus();
    };
    // <<< feedback-modal:end

    window.addEventListener('cnstock:login', () => updateLogout());
    window.addEventListener('cnstock:logout', () => updateLogout());
    updateLogout();

    // 轮询离线通知；未登录时暂停
    setInterval(async () => {
      if (!CNStockAuth.isLoggedIn()) return;
      try {
        const res = await CNStockAuth.apiFetch('/api/inbox');
        const { messages } = await res.json();
        for (const m of messages || []) addMsg(m, 'bot');
        // App 壳桥接（REQ-F7-3）：本页是 /api/inbox 唯一轮询者（drain 语义），
        // 把 drain 到的消息转交原生层弹系统通知；浏览器无桥对象，try/catch 兜底，
        // 桥接失败绝不影响聊天渲染。
        if ((messages || []).length && window.CNStockAndroid) {
          try { window.CNStockAndroid.onInboxMessages(JSON.stringify(messages)); } catch { /* 桥接失败不影响聊天 */ }
        }
      } catch { /* 忽略轮询错误 */ }
    }, 30000);
  </script>
</body>
</html>
