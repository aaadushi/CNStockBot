<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股助手 - A 股信息助手</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <style>
    body { height: 100vh; display: flex; flex-direction: column; }
    .chat-wrap {
      flex: 1; max-width: 720px; width: 100%; margin: 0 auto;
      display: flex; flex-direction: column; min-height: 0; padding: 20px;
      gap: 12px;
    }
    #chat {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
      padding: 4px 2px;
    }
    .msg {
      max-width: 78%; padding: 12px 16px; font-size: 14px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word;
    }
    .user {
      align-self: flex-end; background: var(--accent); color: #fff;
      border-radius: 18px 18px 6px 18px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, .25);
    }
    .bot {
      align-self: flex-start; background: var(--card);
      border: 0; border-radius: 18px 18px 18px 6px;
      box-shadow: var(--shadow-md);
    }
    .bot.error { background: var(--up-soft); color: var(--up); }

    /* 欢迎建议 chip */
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; }
    .chip {
      font-size: 13px; color: var(--text-2); background: var(--card);
      border: 0; border-radius: 999px; padding: 8px 16px;
      box-shadow: var(--shadow-sm);
      cursor: pointer; transition: all 200ms ease-in-out;
    }
    .chip:hover {
      color: var(--accent); background: var(--accent-soft);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, .2);
    }
    .chip:active { transform: scale(.97); }

    /* 思考中三点动画 */
    .thinking::after {
      content: ''; display: inline-block; width: 1.2em; text-align: left;
      animation: dots 1.2s steps(4) infinite;
    }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

    /* 输入区 */
    #bar {
      display: flex; gap: 10px; background: var(--card);
      border: 0; border-radius: 20px;
      box-shadow: var(--shadow-lg); padding: 10px;
    }
    #input { border: none; box-shadow: none !important; background: transparent; }
    #input:focus { box-shadow: none !important; }
    #send { border-radius: 14px; }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="inner">
      <span class="brand">📊 股助手</span>
      <span class="sub">仅供参考，不构成投资建议</span>
      <span class="spacer"></span>
      <a class="nav" href="/stocks">📈 自选股</a>
      <a class="nav" href="/scanner">🔍 扫描</a>
      <a class="nav" href="/backtest">🧪 回测</a>
      <button class="nav btn-ghost" id="logout-btn" style="display:none">退出</button>
    </div>
  </header>

  <div class="chat-wrap">
    <div id="chat">
      <div class="msg bot">你好！我是股助手。试试这些：</div>
      <div class="suggestions" id="suggestions">
        <button class="chip">600519 现在多少钱？</button>
        <button class="chip">我买了 300750，帮我加自选</button>
        <button class="chip">我的自选股今天怎么样？</button>
      </div>
    </div>
    <div id="bar">
      <input id="input" class="input" placeholder="输入消息，回车发送…" autofocus />
      <button id="send" class="btn btn-primary">发送</button>
    </div>
  </div>

  <script src="/shared/auth.js"></script>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const logoutBtn = document.getElementById('logout-btn');

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      const sg = document.getElementById('suggestions');
      if (sg && (cls === 'user')) sg.remove();
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function updateLogout() {
      logoutBtn.style.display = CNStockAuth.isLoggedIn() ? 'inline-block' : 'none';
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg(text, 'user');
      sendBtn.disabled = true;
      const pending = addMsg('思考中', 'bot');
      pending.classList.add('thinking');
      try {
        const res = await CNStockAuth.apiFetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        pending.classList.remove('thinking');
        pending.textContent = data.reply || data.error || '（无回复）';
        if (data.error) pending.classList.add('error');
      } catch (e) {
        pending.classList.remove('thinking');
        pending.textContent = '请求失败：' + e.message;
        pending.classList.add('error');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = send;
    input.onkeydown = (e) => { if (e.key === 'Enter') send(); };
    document.getElementById('suggestions').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      input.value = chip.textContent;
      send();
    });

    logoutBtn.onclick = () => {
      CNStockAuth.logout();
      updateLogout();
      addMsg('已退出登录', 'bot');
    };

    window.addEventListener('cnstock:login', () => updateLogout());
    window.addEventListener('cnstock:logout', () => updateLogout());
    updateLogout();

    // 轮询离线通知；未登录时暂停
    setInterval(async () => {
      if (!CNStockAuth.isLoggedIn()) return;
      try {
        const res = await CNStockAuth.apiFetch('/api/inbox');
        const { messages } = await res.json();
        for (const m of messages || []) addMsg(m, 'bot');
        // App 壳桥接（REQ-F7-3）：本页是 /api/inbox 唯一轮询者（drain 语义），
        // 把 drain 到的消息转交原生层弹系统通知；浏览器无桥对象，try/catch 兜底，
        // 桥接失败绝不影响聊天渲染。
        if ((messages || []).length && window.CNStockAndroid) {
          try { window.CNStockAndroid.onInboxMessages(JSON.stringify(messages)); } catch { /* 桥接失败不影响聊天 */ }
        }
      } catch { /* 忽略轮询错误 */ }
    }, 30000);
  </script>
</body>
</html>
