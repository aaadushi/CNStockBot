<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股助手 - 板块轮动</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <style>
    /* ---- 个股查板块 ---- */
    .stock-sector-box { display: flex; gap: 8px; }
    .stock-sector-box .input { flex: 1; }
    .resonance-card { margin-top: 12px; }
    .resonance-card .line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
    .resonance-card .line + .line { margin-top: 6px; }
    .resonance-card .k { color: var(--text-3); }
    .sector-link { color: var(--accent); cursor: pointer; text-decoration: none; }
    .sector-link:hover { text-decoration: underline; }

    /* ---- Tab ---- */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .tabs button {
      border: none; background: none; font-family: var(--font); font-size: 14px; color: var(--text-2);
      padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color 150ms ease;
    }
    .tabs button:hover { color: var(--text); }
    .tabs button.active { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); }

    /* ---- 板块卡片 ---- */
    .sector-list { display: flex; flex-direction: column; gap: 12px; }
    .sector-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); padding: 16px 20px; cursor: pointer;
      transition: box-shadow 150ms ease, transform 150ms ease;
    }
    .sector-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .sector-card .rank {
      width: 28px; text-align: center; font-size: 13px; font-weight: 600;
      color: var(--text-3); font-variant-numeric: tabular-nums; flex-shrink: 0;
    }
    .sector-card .rank.top { color: var(--up); }
    .sector-card .meta { flex: 1; min-width: 0; }
    .sector-card .name { font-size: 16px; font-weight: 600; }
    .sector-card .sub { font-size: 12px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .sector-card .quote { text-align: right; font-variant-numeric: tabular-nums; }
    .sector-card .price { font-size: 16px; font-weight: 600; margin-bottom: 2px; }

    /* ---- 板块详情 ---- */
    .detail-top { display: flex; align-items: center; gap: 12px; }
    .back-link {
      font-size: 13px; color: var(--text-2); text-decoration: none;
      padding: 6px 10px; border-radius: 8px; transition: background 150ms ease, color 150ms ease;
    }
    .back-link:hover { background: var(--border); color: var(--text); }
    .detail-top .title { flex: 1; min-width: 0; }
    .detail-top .title .name { font-size: 20px; font-weight: 600; }
    .detail-top .title .code { font-size: 13px; color: var(--text-2); margin-left: 8px; }
    .stat-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
    }
    .stat-grid .label { font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
    .stat-grid .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    @media (max-width: 640px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }

    /* ---- 走势图 ---- */
    .chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .chart-head h3 { font-size: 15px; font-weight: 600; }
    .chart-box { position: relative; }
    .chart-box svg { display: block; width: 100%; height: auto; }
    .chart-tip {
      position: absolute; pointer-events: none; display: none; z-index: 5;
      background: var(--text); color: #fff; font-size: 12px; border-radius: 8px;
      padding: 6px 10px; line-height: 1.5; white-space: nowrap;
      transform: translate(-50%, -100%); font-variant-numeric: tabular-nums;
    }
    .range-pills { display: flex; gap: 4px; flex-wrap: wrap; background: var(--bg); border-radius: 999px; padding: 3px; width: fit-content; }
    .range-pills button {
      border: none; background: none; font-family: var(--font); font-size: 12px; color: var(--text-2);
      padding: 4px 12px; border-radius: 999px; cursor: pointer; transition: all 150ms ease;
    }
    .range-pills button:hover { color: var(--text); }
    .range-pills button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    /* ---- 成分股表 ---- */
    .cons-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cons-table th { text-align: right; font-size: 12px; color: var(--text-3); font-weight: 500; padding: 8px 8px; border-bottom: 1px solid var(--border); }
    .cons-table th:first-child, .cons-table td:first-child { text-align: left; }
    .cons-table td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    .cons-table tbody tr { cursor: pointer; transition: background 120ms ease; }
    .cons-table tbody tr:hover { background: var(--bg); }
    .cons-table tbody tr:last-child td { border-bottom: none; }
    .cons-table .c-name { font-weight: 600; }
    .cons-table .c-code { font-size: 12px; color: var(--text-3); }

    .list-note { font-size: 12px; color: var(--text-3); margin-top: 12px; text-align: center; }
    .block-error { color: var(--text-3); font-size: 13px; padding: 16px 4px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="inner">
      <span class="brand">📈 股助手</span>
      <span class="sub" id="header-sub">板块轮动</span>
      <span class="spacer"></span>
      <a class="nav" href="/stocks">⭐ 自选股</a>
      <a class="nav" href="/market">📊 涨跌榜</a>
      <a class="nav" href="/funds">💰 基金</a>
      <a class="nav" href="/news">📰 快讯</a>
      <a class="nav" href="/overseas">🌐 外盘</a>
      <a class="nav" href="/scanner">🔍 扫描</a>
      <a class="nav" href="/backtest">🧪 回测</a>
      <a class="nav" href="/webchat">💬 聊天</a>
    </div>
  </header>

  <main class="page">
    <!-- ========== 列表视图 ========== -->
    <section id="view-list">
      <div class="card" style="margin-bottom: 16px;">
        <div class="stock-sector-box">
          <input id="stock-input" class="input" placeholder="查个股所属板块：输入股票代码或名称（如 600519 / 茅台）" autocomplete="off" />
          <button class="btn btn-primary" id="stock-btn">查询</button>
        </div>
        <div id="resonance"></div>
      </div>

      <div class="card">
        <div class="tabs" id="tabs">
          <button data-tab="rank" class="active">涨跌排行</button>
          <button data-tab="flow">资金流排行</button>
        </div>
        <div id="sector-list" class="sector-list"></div>
        <div class="list-note" id="list-note"></div>
      </div>
    </section>

    <!-- ========== 板块详情视图（?name=） ========== -->
    <section id="view-detail" hidden>
      <div class="card" style="margin-bottom: 16px;">
        <div class="detail-top" style="margin-bottom: 16px;">
          <a class="back-link" href="/sectors">← 返回板块列表</a>
          <div class="title">
            <span class="name" id="d-name"></span>
            <span class="code" id="d-code"></span>
            <span id="d-badge" style="margin-left: 8px;"></span>
          </div>
        </div>
        <div class="stat-grid" id="d-stats"></div>
      </div>

      <div class="card" style="margin-bottom: 16px;">
        <div class="chart-head">
          <h3>板块走势（日 K 收盘）</h3>
          <div class="range-pills" id="range-pills">
            <button data-n="22">近1月</button>
            <button data-n="63" class="active">近3月</button>
            <button data-n="126">近6月</button>
            <button data-n="250">近1年</button>
          </div>
        </div>
        <div class="chart-box" id="chart-box">
          <div class="chart-tip" id="chart-tip"></div>
        </div>
      </div>

      <div class="card">
        <div class="chart-head">
          <h3>成分股</h3>
          <span class="text-3" style="font-size: 12px;" id="cons-note"></span>
        </div>
        <div style="overflow-x: auto;">
          <table class="cons-table">
            <thead>
              <tr><th>名称</th><th>最新价</th><th>涨跌幅</th><th>换手率</th><th>成交额</th></tr>
            </thead>
            <tbody id="cons-body"></tbody>
          </table>
        </div>
        <div class="list-note">点击成分股跳个股详情页</div>
      </div>
    </section>

    <div class="disclaimer">
      数据来源：东方财富行业板块（经 data-service，排行/资金流缓存约 60s，延时镜像约 15 分钟）。
      名次与资金流为客观统计，不构成任何推荐。数据仅供参考，不构成投资建议
    </div>
  </main>

  <!-- 口令鉴权浮层（与其他页面共用 localStorage 键） -->
  <div class="auth-overlay" id="auth-overlay" hidden>
    <div class="auth-card">
      <h2>输入访问口令</h2>
      <p>口令见服务端启动日志或 .env 的 ACCESS_TOKEN</p>
      <input id="auth-input" class="input" type="password" placeholder="ACCESS_TOKEN" />
      <div class="error" id="auth-error"></div>
      <button class="btn btn-primary" id="auth-confirm">确认</button>
    </div>
  </div>

  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);

    /* ================= 鉴权（与其他页面共用 localStorage 键） ================= */
    let accessToken = localStorage.getItem('cnstockbot_token') || '';

    const authOverlay = $('auth-overlay');
    let authResolve = null;
    function showAuth(hasError) {
      $('auth-error').textContent = hasError ? '口令错误，请重新输入' : '';
      authOverlay.hidden = false;
      $('auth-input').focus();
      return new Promise((resolve) => { authResolve = resolve; });
    }
    function submitAuth() {
      const t = $('auth-input').value.trim();
      if (!t) return;
      accessToken = t;
      localStorage.setItem('cnstockbot_token', t);
      $('auth-input').value = '';
      authOverlay.hidden = true;
      if (authResolve) { authResolve(); authResolve = null; }
    }
    $('auth-confirm').onclick = submitAuth;
    $('auth-input').onkeydown = (e) => { if (e.key === 'Enter') submitAuth(); };

    async function apiFetch(url, options = {}) {
      if (!accessToken) await showAuth(false);
      options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + accessToken });
      const res = await fetch(url, options);
      if (res.status === 401) {
        accessToken = '';
        localStorage.removeItem('cnstockbot_token');
        await showAuth(true);
        return apiFetch(url, options);
      }
      return res;
    }

    /* ================= 工具 ================= */
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text; // 一律 textContent，防 XSS
      return e;
    }
    function fmtPct(v) {
      if (typeof v !== 'number' || !isFinite(v)) return null;
      return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
    }
    function pctBadge(v) {
      const s = fmtPct(v);
      const badge = el('span', 'badge', s ?? '—');
      badge.classList.add(s == null ? 'badge-flat' : v > 0 ? 'badge-up' : v < 0 ? 'badge-down' : 'badge-flat');
      return badge;
    }
    function upDownClass(v) { return v > 0 ? 'text-up' : v < 0 ? 'text-down' : 'text-2'; }
    function fmtAmount(v) { // 金额（元）→ 亿/万
      if (typeof v !== 'number' || !isFinite(v)) return null;
      if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(1) + ' 亿';
      if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(0) + ' 万';
      return String(Math.round(v));
    }
    function sourceNote(source) {
      return source === 'eastmoney-delay' ? '（延时约 15 分钟）' : '';
    }
    function goBoard(name) { location.href = '/sectors?name=' + encodeURIComponent(name); }

    /* ================= 路由（?name= 为板块详情视图） ================= */
    let currentBoard = null;

    function renderRoute() {
      const name = new URLSearchParams(location.search).get('name');
      currentBoard = name && name.trim() ? name.trim() : null;
      $('view-list').hidden = !!currentBoard;
      $('view-detail').hidden = !currentBoard;
      $('header-sub').textContent = currentBoard ? '板块详情' : '板块轮动';
      if (currentBoard) loadBoardDetail();
    }
    window.addEventListener('popstate', renderRoute);

    /* ================= 列表视图：涨跌排行 / 资金流排行 ================= */
    let activeTab = 'rank';
    const cache = {}; // 'rank' / 'flow' -> {source, items}

    function rankCard(s) {
      const card = el('div', 'sector-card');
      card.appendChild(el('div', 'rank' + (s.rank <= 3 ? ' top' : ''), String(s.rank)));
      const meta = el('div', 'meta');
      meta.appendChild(el('div', 'name', s.name));
      const sub = [];
      if (s.leadStock) sub.push('领涨 ' + s.leadStock + (fmtPct(s.leadStockChangePct) ? ' ' + fmtPct(s.leadStockChangePct) : ''));
      if (s.upCount != null && s.downCount != null) sub.push('涨 ' + s.upCount + ' / 跌 ' + s.downCount);
      const amt = fmtAmount(s.amount);
      if (amt) sub.push('成交额 ' + amt);
      if (sub.length) meta.appendChild(el('div', 'sub', sub.join('　')));
      card.appendChild(meta);
      const quote = el('div', 'quote');
      quote.appendChild(el('div', 'price ' + upDownClass(s.changePct), s.price != null ? Number(s.price).toFixed(2) : '—'));
      quote.appendChild(pctBadge(s.changePct));
      card.appendChild(quote);
      card.onclick = () => goBoard(s.name);
      return card;
    }

    function flowCard(s) {
      const card = el('div', 'sector-card');
      card.appendChild(el('div', 'rank' + (s.rank <= 3 ? ' top' : ''), String(s.rank)));
      const meta = el('div', 'meta');
      meta.appendChild(el('div', 'name', s.name));
      const sub = [];
      const main = fmtAmount(s.mainNetInflow);
      if (main) sub.push('主力净流入 ' + main + (s.mainNetInflowPct != null ? '（' + fmtPct(s.mainNetInflowPct) + '）' : ''));
      if (s.topStock) sub.push('最大净流入股 ' + s.topStock);
      if (sub.length) meta.appendChild(el('div', 'sub', sub.join('　')));
      card.appendChild(meta);
      const quote = el('div', 'quote');
      quote.appendChild(el('div', 'price ' + upDownClass(s.mainNetInflow), main ?? '—'));
      quote.appendChild(pctBadge(s.changePct));
      card.appendChild(quote);
      card.onclick = () => goBoard(s.name);
      return card;
    }

    function renderList(data) {
      const box = $('sector-list');
      box.replaceChildren();
      if (!data) return;
      if (!data.items.length) {
        box.appendChild(el('div', 'block-error', '暂无数据'));
        return;
      }
      for (const s of data.items) box.appendChild(activeTab === 'flow' ? flowCard(s) : rankCard(s));
      $('list-note').textContent = (activeTab === 'flow' ? '按今日主力净流入降序' : '按今日涨跌幅降序')
        + '，显示前 ' + data.items.length + ' 个行业板块' + sourceNote(data.source);
    }

    async function loadList(force) {
      const key = activeTab;
      if (!force && cache[key]) { renderList(cache[key]); return; }
      $('sector-list').replaceChildren(el('div', 'block-error', '加载中…（首次加载需翻页拉取全量板块，约数秒）'));
      $('list-note').textContent = '';
      try {
        const res = await apiFetch(key === 'flow' ? '/api/sectors/fund-flow?limit=100' : '/api/sectors/rank?limit=100');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        cache[key] = data;
        if (activeTab !== key) return;
        renderList(data);
      } catch (e) {
        $('sector-list').replaceChildren(el('div', 'block-error', '加载失败：' + e.message));
      }
    }

    $('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-tab]');
      if (!btn) return;
      activeTab = btn.dataset.tab;
      for (const b of $('tabs').querySelectorAll('button')) b.classList.toggle('active', b === btn);
      loadList();
    });

    /* ================= 列表视图：查个股所属板块 ================= */
    let stockSeq = 0;

    async function queryStockSector() {
      const kw = $('stock-input').value.trim();
      const box = $('resonance');
      box.replaceChildren();
      if (!kw) return;
      const seq = ++stockSeq;
      box.appendChild(el('div', 'block-error', '查询中…'));
      try {
        let code = kw;
        if (!/^\d{6}$/.test(kw)) {
          const sres = await apiFetch('/api/search?keyword=' + encodeURIComponent(kw));
          const sdata = await sres.json();
          if (!sres.ok) throw new Error(sdata.error || ('HTTP ' + sres.status));
          if (!sdata.results || !sdata.results.length) throw new Error('未找到匹配"' + kw + '"的股票');
          code = sdata.results[0].code;
        }
        const res = await apiFetch('/api/sectors/of-stock/' + code);
        const data = await res.json();
        if (seq !== stockSeq) return; // 过期响应丢弃
        box.replaceChildren();
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        box.appendChild(resonanceCard(data));
      } catch (e) {
        if (seq !== stockSeq) return;
        box.replaceChildren(el('div', 'block-error', '查询失败：' + e.message));
      }
    }

    function resonanceCard(d) {
      const card = el('div', 'resonance-card');
      const head = el('div', 'line');
      head.appendChild(el('span', '', (d.name || d.code) + '（' + d.code + '）'));
      if (d.industry) {
        head.appendChild(el('span', 'k', '所属行业'));
        head.appendChild(el('span', '', d.industry));
      }
      card.appendChild(head);
      if (!d.matched || !d.sector) {
        card.appendChild(el('div', 'line text-3', d.industry
          ? '该行业暂未匹配到东财行业板块排行中的同名板块'
          : '未获取到该股票的所属行业信息'));
        return card;
      }
      const s = d.sector;
      const line2 = el('div', 'line');
      line2.appendChild(el('span', 'k', '板块'));
      const link = el('span', 'sector-link', s.name);
      link.onclick = () => goBoard(s.name);
      line2.appendChild(link);
      line2.appendChild(pctBadge(s.changePct));
      line2.appendChild(el('span', 'text-2', '涨跌幅排名 ' + s.rank + ' / ' + s.total + sourceNote(d.source)));
      card.appendChild(line2);
      if (s.fundFlowRank != null) {
        const line3 = el('div', 'line');
        const main = fmtAmount(s.mainNetInflow);
        line3.appendChild(el('span', 'k', '资金流'));
        line3.appendChild(el('span', '', '主力净流入名次 ' + s.fundFlowRank + ' / ' + s.fundFlowTotal
          + (main ? '　净流入 ' + main : '')
          + (s.mainNetInflowPct != null ? '（' + fmtPct(s.mainNetInflowPct) + '）' : '')));
        card.appendChild(line3);
      }
      return card;
    }

    $('stock-btn').onclick = queryStockSector;
    $('stock-input').onkeydown = (e) => { if (e.key === 'Enter') queryStockSector(); };

    /* ================= 板块详情视图 ================= */
    let boardHist = null;   // SectorHistory（bars 最多 250 条，区间切换本地切片）
    let boardCons = null;   // SectorCons
    let rangeN = 63;

    async function loadBoardDetail() {
      $('d-name').textContent = '';
      $('d-code').textContent = '';
      $('d-badge').replaceChildren();
      $('d-stats').replaceChildren();
      $('cons-body').replaceChildren();
      $('cons-note').textContent = '';
      const box = $('chart-box');
      box.querySelectorAll('svg, .block-error, .skeleton').forEach((n) => n.remove());
      $('chart-tip').style.display = 'none';
      const sk = el('div', 'skeleton'); sk.style.height = '260px';
      box.appendChild(sk);
      const q = encodeURIComponent(currentBoard);
      // 走势图与成分股独立加载，互不阻塞
      loadBoardHistory(q, sk);
      loadBoardCons(q);
    }

    async function loadBoardHistory(q, sk) {
      const box = $('chart-box');
      try {
        const res = await apiFetch('/api/sectors/history?name=' + q + '&days=250');
        const data = await res.json();
        if (currentBoard !== new URLSearchParams(location.search).get('name')) return;
        sk.remove();
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        boardHist = data;
        $('d-name').textContent = data.name;
        $('d-code').textContent = data.code;
        const last = data.bars[data.bars.length - 1];
        if (last) $('d-badge').replaceChildren(pctBadge(last.changePct));
        renderBoardStats();
        drawRange();
      } catch (e) {
        sk.remove();
        $('d-name').textContent = currentBoard;
        box.appendChild(el('div', 'block-error', '板块走势加载失败：' + e.message));
      }
    }

    function renderBoardStats() {
      const stats = $('d-stats');
      stats.replaceChildren();
      if (!boardHist || !boardHist.bars.length) return;
      const last = boardHist.bars[boardHist.bars.length - 1];
      const defs = [
        ['最新收盘', last.close != null ? Number(last.close).toFixed(2) : '—'],
        ['涨跌幅', fmtPct(last.changePct) ?? '—', last.changePct],
        ['成交额', fmtAmount(last.amount) ?? '—'],
        ['数据日期', last.date],
      ];
      for (const [label, value, pct] of defs) {
        const cell = el('div');
        cell.appendChild(el('div', 'label', label));
        cell.appendChild(el('div', 'value' + (typeof pct === 'number' ? ' ' + upDownClass(pct) : ''), value));
        stats.appendChild(cell);
      }
    }

    async function loadBoardCons(q) {
      const tbody = $('cons-body');
      try {
        const res = await apiFetch('/api/sectors/cons?name=' + q + '&limit=200');
        const data = await res.json();
        if (currentBoard !== new URLSearchParams(location.search).get('name')) return;
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        boardCons = data;
        tbody.replaceChildren();
        for (const c of data.items) {
          const tr = el('tr');
          const tdName = el('td');
          tdName.appendChild(el('span', 'c-name', c.name));
          tdName.appendChild(el('span', 'c-code', ' ' + c.code));
          tr.appendChild(tdName);
          tr.appendChild(el('td', upDownClass(c.changePct), c.price != null ? Number(c.price).toFixed(2) : '—'));
          tr.appendChild(el('td', upDownClass(c.changePct), fmtPct(c.changePct) ?? '—'));
          tr.appendChild(el('td', '', c.turnover != null ? Number(c.turnover).toFixed(2) + '%' : '—'));
          tr.appendChild(el('td', '', fmtAmount(c.amount) ?? '—'));
          tr.onclick = () => { location.href = '/stocks?code=' + encodeURIComponent(c.code); };
          tbody.appendChild(tr);
        }
        $('cons-note').textContent = '共 ' + data.items.length + ' 只，按涨跌幅降序' + sourceNote(data.source);
      } catch (e) {
        tbody.replaceChildren();
        $('cons-note').textContent = '成分股加载失败：' + e.message;
      }
    }

    $('range-pills').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-n]');
      if (!btn) return;
      rangeN = Number(btn.dataset.n);
      $('range-pills').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
      drawRange();
    });

    function drawRange() {
      const box = $('chart-box');
      box.querySelectorAll('svg, .block-error').forEach((n) => n.remove());
      $('chart-tip').style.display = 'none';
      const pts = (boardHist && boardHist.bars ? boardHist.bars : [])
        .filter((p) => typeof p.close === 'number')
        .slice(-rangeN);
      if (pts.length < 2) {
        box.appendChild(el('div', 'block-error', '该区间走势数据不足'));
        return;
      }
      drawChart(box, pts);
    }

    /* ---- 手写 SVG 折线图（改写自 /funds 详情页，收盘价版） ---- */
    function drawChart(box, pts) {
      const W = 680, H = 260, padL = 52, padR = 12, padT = 14, padB = 26;
      const iw = W - padL - padR, ih = H - padT - padB;
      const vals = pts.map((p) => p.close);
      let min = Math.min(...vals), max = Math.max(...vals);
      if (min === max) { min *= 0.99; max *= 1.01; }
      const pad = (max - min) * 0.08; min -= pad; max += pad;
      const x = (i) => padL + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw);
      const y = (v) => padT + (1 - (v - min) / (max - min)) * ih;

      const up = vals[vals.length - 1] >= vals[0];
      const lineColor = up ? '#dc2626' : '#16a34a';
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.height = '260px';

      const defs = document.createElementNS(ns, 'defs');
      const grad = document.createElementNS(ns, 'linearGradient');
      grad.id = 'fill-grad'; grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
      grad.setAttribute('x2', '0'); grad.setAttribute('y2', '1');
      const s1 = document.createElementNS(ns, 'stop');
      s1.setAttribute('offset', '0'); s1.setAttribute('stop-color', lineColor); s1.setAttribute('stop-opacity', '0.16');
      const s2 = document.createElementNS(ns, 'stop');
      s2.setAttribute('offset', '1'); s2.setAttribute('stop-color', lineColor); s2.setAttribute('stop-opacity', '0');
      grad.append(s1, s2); defs.appendChild(grad); svg.appendChild(defs);

      for (let g = 0; g <= 3; g++) {
        const v = min + ((max - min) * g) / 3;
        const gy = y(v);
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', padL); line.setAttribute('x2', W - padR);
        line.setAttribute('y1', gy); line.setAttribute('y2', gy);
        line.setAttribute('stroke', '#e4e4e7'); line.setAttribute('stroke-dasharray', g === 0 || g === 3 ? '0' : '3 3');
        svg.appendChild(line);
        const label = document.createElementNS(ns, 'text');
        label.setAttribute('x', padL - 8); label.setAttribute('y', gy + 4);
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('fill', '#a1a1aa'); label.setAttribute('font-size', '11');
        label.textContent = v.toFixed(1);
        svg.appendChild(label);
      }

      for (const [i, anchor] of [[0, 'start'], [pts.length - 1, 'end']]) {
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('x', x(i)); t.setAttribute('y', H - 8);
        t.setAttribute('text-anchor', anchor);
        t.setAttribute('fill', '#a1a1aa'); t.setAttribute('font-size', '11');
        t.textContent = pts[i].date;
        svg.appendChild(t);
      }

      const path = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.close).toFixed(1)}`);
      const area = document.createElementNS(ns, 'path');
      area.setAttribute('d', `M${padL},${y(min)} L${path.join(' L')} L${W - padR},${y(min)} Z`);
      area.setAttribute('fill', 'url(#fill-grad)');
      svg.appendChild(area);
      const line2 = document.createElementNS(ns, 'path');
      line2.setAttribute('d', `M${path.join(' L')}`);
      line2.setAttribute('fill', 'none');
      line2.setAttribute('stroke', lineColor);
      line2.setAttribute('stroke-width', '2');
      line2.setAttribute('stroke-linejoin', 'round');
      line2.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(line2);

      const vline = document.createElementNS(ns, 'line');
      vline.setAttribute('stroke', '#a1a1aa'); vline.setAttribute('stroke-dasharray', '3 3');
      vline.setAttribute('y1', padT); vline.setAttribute('y2', H - padB);
      vline.style.display = 'none';
      svg.appendChild(vline);
      const dot = document.createElementNS(ns, 'circle');
      dot.setAttribute('r', '4'); dot.setAttribute('fill', lineColor);
      dot.setAttribute('stroke', '#fff'); dot.setAttribute('stroke-width', '2');
      dot.style.display = 'none';
      svg.appendChild(dot);

      const tip = $('chart-tip');
      const overlay = document.createElementNS(ns, 'rect');
      overlay.setAttribute('x', padL); overlay.setAttribute('y', padT);
      overlay.setAttribute('width', iw); overlay.setAttribute('height', ih);
      overlay.setAttribute('fill', 'transparent');
      overlay.addEventListener('mousemove', (e) => {
        const rect = svg.getBoundingClientRect();
        const mx = ((e.clientX - rect.left) / rect.width) * W;
        const i = Math.max(0, Math.min(pts.length - 1, Math.round(((mx - padL) / iw) * (pts.length - 1))));
        const p = pts[i];
        vline.setAttribute('x1', x(i)); vline.setAttribute('x2', x(i));
        vline.style.display = '';
        dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(p.close));
        dot.style.display = '';
        tip.replaceChildren();
        tip.appendChild(el('div', '', p.date));
        const pc = fmtPct(p.changePct);
        tip.appendChild(el('div', '', `收盘 ${p.close.toFixed(2)}${pc ? '  ' + pc : ''}`));
        tip.style.display = 'block';
        const px = (x(i) / W) * rect.width;
        const py = (y(p.close) / H) * rect.height;
        tip.style.left = Math.max(70, Math.min(rect.width - 70, px)) + 'px';
        tip.style.top = (py - 10) + 'px';
      });
      overlay.addEventListener('mouseleave', () => {
        vline.style.display = 'none'; dot.style.display = 'none'; tip.style.display = 'none';
      });
      svg.appendChild(overlay);

      box.appendChild(svg);
    }

    /* ================= 启动 ================= */
    renderRoute();
    if (!currentBoard) loadList();
  </script>
</body>
</html>
