<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股助手 - 我的自选股</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <style>
    /* ---- 搜索 ---- */
    .search-wrap { position: relative; }
    .search-box { position: relative; }
    .search-box .icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-3); font-size: 14px; pointer-events: none;
    }
    .search-box .input { padding-left: 38px; border-radius: var(--radius); }
    .search-results {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 20;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-md); padding: 8px; display: none;
      max-height: 380px; overflow-y: auto;
    }
    .search-results.open { display: flex; flex-direction: column; gap: 8px; }

    /* ---- 股票卡片（自选股列表 / 搜索结果同款圆角矩形） ---- */
    .stock-list { display: flex; flex-direction: column; gap: 12px; }
    .stock-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); padding: 16px 20px; cursor: pointer;
      transition: box-shadow 150ms ease, transform 150ms ease;
    }
    .stock-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .stock-card .meta { flex: 1; min-width: 0; }
    .stock-card .name { font-size: 16px; font-weight: 600; }
    .stock-card .code { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .stock-card .quote { text-align: right; font-variant-numeric: tabular-nums; }
    .stock-card .price { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .stock-card .na { font-size: 13px; color: var(--text-3); }
    .stock-card .remove {
      border: none; background: none; color: var(--text-3); font-size: 16px;
      cursor: pointer; padding: 4px 8px; border-radius: 8px; line-height: 1;
      transition: background 150ms ease, color 150ms ease;
    }
    .stock-card .remove:hover { background: var(--up-soft); color: var(--up); }

    /* ---- 详情页 ---- */
    .detail-top { display: flex; align-items: center; gap: 12px; }
    .back-link {
      font-size: 13px; color: var(--text-2); text-decoration: none;
      padding: 6px 10px; border-radius: 8px; transition: background 150ms ease, color 150ms ease;
    }
    .back-link:hover { background: var(--border); color: var(--text); }
    .detail-top .title { flex: 1; min-width: 0; }
    .detail-top .title .name { font-size: 20px; font-weight: 600; }
    .detail-top .title .code { font-size: 13px; color: var(--text-2); margin-left: 8px; }

    .quote-main { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
    .quote-main .price { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .quote-main .time { font-size: 12px; color: var(--text-3); margin-left: auto; }
    .stat-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
    }
    .stat-grid .label { font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
    .stat-grid .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ---- 走势图 ---- */
    .chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .chart-head h3 { font-size: 15px; font-weight: 600; }
    .chart-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .range-pills { display: flex; gap: 4px; background: var(--bg); border-radius: 999px; padding: 3px; }
    .range-pills button {
      border: none; background: none; font-family: var(--font); font-size: 12px; color: var(--text-2);
      padding: 4px 12px; border-radius: 999px; cursor: pointer; transition: all 150ms ease;
    }
    .range-pills button:hover { color: var(--text); }
    .range-pills button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .chart-box { position: relative; }
    .chart-box svg { display: block; width: 100%; height: auto; }
    .chart-tip {
      position: absolute; pointer-events: none; display: none; z-index: 5;
      background: var(--text); color: #fff; font-size: 12px; border-radius: 8px;
      padding: 6px 10px; line-height: 1.5; white-space: nowrap;
      transform: translate(-50%, -100%); font-variant-numeric: tabular-nums;
    }

    /* ---- Tab 卡 ---- */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .tabs button {
      border: none; background: none; font-family: var(--font); font-size: 14px; color: var(--text-2);
      padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color 150ms ease;
    }
    .tabs button:hover { color: var(--text); }
    .tabs button.active { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); }
    .tab-list { display: flex; flex-direction: column; }
    .tab-item { padding: 12px 4px; border-bottom: 1px solid var(--border); }
    .tab-item:last-child { border-bottom: none; }
    .tab-item a { color: var(--text); text-decoration: none; font-size: 14px; transition: color 150ms ease; }
    .tab-item a:hover { color: var(--accent); }
    .tab-item .sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .fin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .fin-table th { text-align: left; font-size: 12px; color: var(--text-3); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .fin-table td { padding: 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    .fin-table tbody tr:hover { background: var(--bg); }
    .block-error { color: var(--text-3); font-size: 13px; padding: 16px 4px; }
    .flow-note { font-size: 12px; color: var(--text-3); margin-top: 10px; }
    .flow-chart-box { position: relative; margin-top: 16px; }
    .flow-chart-box svg { display: block; width: 100%; height: auto; }
    /* ---- 技术指标面板与均线图例（F5-1） ---- */
    .ma-legend { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--text-3); }
    .ma-legend b { font-weight: 600; }
    .ind-group { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 14px 0 8px; }
    .ind-group:first-child { margin-top: 0; }
    .sig-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .sig-chip {
      font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
    }
    [hidden] { display: none !important; }
    /* ---- AI 多维分析（F5-2） ---- */
    .ai-result { font-size: 14px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
    .ai-hint { font-size: 13px; color: var(--text-3); }
    .ai-loading::after {
      content: ''; display: inline-block; width: 1.2em; text-align: left;
      animation: dots 1.2s steps(4) infinite;
    }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="inner">
      <span class="brand">📈 股助手</span>
      <span class="sub" id="header-sub">我的自选股</span>
      <span class="spacer"></span>
      <a class="nav" href="/market">📊 涨跌榜</a>
      <a class="nav" href="/funds">💰 基金</a>
      <a class="nav" href="/news">📰 快讯</a>
      <a class="nav" href="/overseas">🌐 外盘</a>
      <a class="nav" href="/webchat">💬 聊天</a>
    </div>
  </header>

  <main class="page">
    <!-- ========== 列表视图 ========== -->
    <section id="view-list">
      <div class="search-wrap">
        <div class="search-box">
          <span class="icon">🔍</span>
          <input id="search-input" class="input" placeholder="输入代码或名称搜索" autocomplete="off" />
        </div>
        <div id="search-results" class="search-results"></div>
      </div>
      <div id="watchlist" class="stock-list" style="margin-top: 16px;"></div>
    </section>

    <!-- ========== 详情视图 ========== -->
    <section id="view-detail" hidden>
      <div class="detail-top">
        <a class="back-link" href="/stocks" id="back-link">← 返回</a>
        <div class="title">
          <span class="name" id="d-name">—</span><span class="code" id="d-code"></span>
        </div>
        <button class="btn btn-primary" id="watch-toggle">加入自选</button>
      </div>

      <div class="card" id="quote-card">
        <div class="quote-main">
          <span class="price" id="d-price">—</span>
          <span id="d-badge"></span>
          <span class="time" id="d-time"></span>
        </div>
        <div class="stat-grid" id="d-stats"></div>
      </div>

      <div class="card" id="profile-card" hidden>
        <h3 style="margin-top: 0;">公司资料</h3>
        <div class="stat-grid" id="d-profile"></div>
      </div>

      <div class="card" id="fundflow-card" hidden>
        <h3 style="margin-top: 0;">资金流向</h3>
        <div id="d-fundflow"></div>
      </div>

      <div class="card" id="dividend-card" hidden>
        <h3 style="margin-top: 0;">分红送配</h3>
        <div id="d-dividend"></div>
      </div>

      <div class="card">
        <div class="chart-head">
          <h3 id="chart-title">分时走势</h3>
          <span class="ma-legend" id="ma-legend" hidden></span>
          <div class="chart-controls">
            <div class="range-pills" id="mode-pills">
              <button data-mode="intraday" class="active">分时</button>
              <button data-mode="daily">日K</button>
            </div>
            <div class="range-pills" id="range-pills" hidden>
              <button data-days="30">近1月</button>
              <button data-days="90">近3月</button>
              <button data-days="120" class="active">近6月</button>
              <button data-days="250">近1年</button>
            </div>
          </div>
        </div>
        <div class="chart-box" id="chart-box">
          <div class="chart-tip" id="chart-tip"></div>
        </div>
      </div>

      <div class="card" id="indicator-card" hidden>
        <h3 style="margin-top: 0;">技术指标</h3>
        <div id="d-indicators"></div>
      </div>

      <!-- AI 多维分析（F5-2）：复用 /api/chat 链路，回复同步进聊天页会话历史 -->
      <div class="card" id="ai-card">
        <div class="chart-head">
          <h3 style="margin: 0;">AI 多维分析</h3>
          <button class="btn btn-primary btn-sm" id="ai-run">生成分析</button>
        </div>
        <div id="ai-result" class="ai-result"></div>
        <div class="flow-note">AI 综合行情估值、资金流、技术指标、财报与新闻等公开数据生成客观解读；分析结果会同步出现在聊天页的对话记录中。仅供参考，不构成投资建议。</div>
      </div>

      <div class="card">
        <div class="tabs" id="tabs">
          <button data-tab="news" class="active">新闻</button>
          <button data-tab="announcements">公告</button>
          <button data-tab="financials">财报</button>
        </div>
        <div id="tab-content"></div>
      </div>
    </section>

    <div class="disclaimer">数据仅供参考，不构成投资建议</div>
  </main>

  <!-- 口令鉴权浮层 -->
  <div class="auth-overlay" id="auth-overlay" hidden>
    <div class="auth-card">
      <h2>输入访问口令</h2>
      <p>口令见服务端启动日志或 .env 的 ACCESS_TOKEN</p>
      <input id="auth-input" class="input" type="password" placeholder="ACCESS_TOKEN" />
      <div class="error" id="auth-error"></div>
      <button class="btn btn-primary" id="auth-confirm">确认</button>
    </div>
  </div>

  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);

    /* ================= 鉴权（与 webchat 共用 localStorage 键） ================= */
    const userId = localStorage.getItem('cnstockbot_uid') ||
      (() => { const id = 'web_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('cnstockbot_uid', id); return id; })();
    let accessToken = localStorage.getItem('cnstockbot_token') || '';

    const authOverlay = $('auth-overlay');
    let authResolve = null;
    function showAuth(hasError) {
      $('auth-error').textContent = hasError ? '口令错误，请重新输入' : '';
      authOverlay.hidden = false;
      $('auth-input').focus();
      return new Promise((resolve) => { authResolve = resolve; });
    }
    function submitAuth() {
      const t = $('auth-input').value.trim();
      if (!t) return;
      accessToken = t;
      localStorage.setItem('cnstockbot_token', t);
      $('auth-input').value = '';
      authOverlay.hidden = true;
      if (authResolve) { authResolve(); authResolve = null; }
    }
    $('auth-confirm').onclick = submitAuth;
    $('auth-input').onkeydown = (e) => { if (e.key === 'Enter') submitAuth(); };

    async function apiFetch(url, options = {}) {
      if (!accessToken) await showAuth(false);
      options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + accessToken });
      const res = await fetch(url, options);
      if (res.status === 401) {
        accessToken = '';
        localStorage.removeItem('cnstockbot_token');
        await showAuth(true);
        return apiFetch(url, options); // 重输口令后重试一次（新口令已带上）
      }
      return res;
    }

    /* ================= 工具 ================= */
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text; // 一律 textContent，防 XSS
      return e;
    }
    function fmtPrice(v) { return typeof v === 'number' && isFinite(v) ? v.toFixed(2) : '—'; }
    // 市值（元）→ 亿/万亿 可读格式
    function fmtCap(v) {
      if (typeof v !== 'number' || !isFinite(v) || v <= 0) return '—';
      if (v >= 1e12) return (v / 1e12).toFixed(2) + ' 万亿';
      if (v >= 1e8) return (v / 1e8).toFixed(2) + ' 亿';
      return (v / 1e4).toFixed(2) + ' 万';
    }
    // PE/PB 等比率：缺失/非正值显示 —
    function fmtRatio(v) { return typeof v === 'number' && isFinite(v) && v > 0 ? v.toFixed(2) : '—'; }
    // 股本（股）→ 亿/万股 可读格式
    function fmtShares(v) {
      if (typeof v !== 'number' || !isFinite(v) || v <= 0) return '—';
      if (v >= 1e8) return (v / 1e8).toFixed(2) + ' 亿股';
      return (v / 1e4).toFixed(2) + ' 万股';
    }
    // 成交量（手）→ 万手/亿手 可读格式
    function fmtVol(v) {
      if (typeof v !== 'number' || !isFinite(v) || v < 0) return '—';
      if (v >= 1e8) return (v / 1e8).toFixed(2) + ' 亿手';
      if (v >= 1e4) return (v / 1e4).toFixed(2) + ' 万手';
      return v + ' 手';
    }
    // 资金流（元）→ 带符号 亿/万 可读格式（净流入可正可负，0 是合法值）
    function fmtFlow(v) {
      if (typeof v !== 'number' || !isFinite(v)) return '—';
      const sign = v > 0 ? '+' : v < 0 ? '-' : '';
      const a = Math.abs(v);
      if (a >= 1e8) return sign + (a / 1e8).toFixed(2) + ' 亿';
      if (a >= 1e4) return sign + (a / 1e4).toFixed(2) + ' 万';
      return sign + Math.round(a) + ' 元';
    }
    function fmtPct(v) {
      if (typeof v !== 'number' || !isFinite(v)) return null;
      return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
    }
    function pctBadge(v) {
      const s = fmtPct(v);
      const badge = el('span', 'badge', s ?? '—');
      badge.classList.add(s == null ? 'badge-flat' : v > 0 ? 'badge-up' : v < 0 ? 'badge-down' : 'badge-flat');
      return badge;
    }
    function upDownClass(v) { return v > 0 ? 'text-up' : v < 0 ? 'text-down' : 'text-2'; }

    /* ================= 股票卡片（列表/搜索同款） ================= */
    const watchlistCodes = new Set();

    function stockCard({ code, name, price, changePct, error }, opts = {}) {
      const card = el('div', 'stock-card');
      const meta = el('div', 'meta');
      meta.appendChild(el('div', 'name', name || code));
      meta.appendChild(el('div', 'code', code));
      card.appendChild(meta);

      if (opts.action) {
        // 搜索结果：右侧 "+ 自选" 按钮
        const btn = el('button', 'btn btn-ghost btn-sm', watchlistCodes.has(code) ? '✓ 已加' : '+ 自选');
        btn.disabled = watchlistCodes.has(code);
        btn.onclick = (e) => {
          e.stopPropagation();
          addWatch(code).then((ok) => {
            if (ok) { btn.textContent = '✓ 已加'; btn.disabled = true; loadWatchlist(); }
          });
        };
        card.appendChild(btn);
      } else if (error) {
        card.appendChild(el('div', 'na', '停牌 / 暂无行情'));
      } else {
        const quote = el('div', 'quote');
        quote.appendChild(el('div', 'price ' + upDownClass(changePct), fmtPrice(price)));
        quote.appendChild(pctBadge(changePct));
        card.appendChild(quote);
        const rm = el('button', 'remove', '×');
        rm.title = '移出自选';
        rm.onclick = (e) => {
          e.stopPropagation();
          if (!confirm(`将 ${name || code} 移出自选？`)) return;
          removeWatch(code).then((ok) => { if (ok) loadWatchlist(); });
        };
        card.appendChild(rm);
      }
      card.onclick = () => goDetail(code, name);
      return card;
    }

    /* ================= 列表视图 ================= */
    async function loadWatchlist() {
      const wrap = $('watchlist');
      wrap.replaceChildren(el('div', 'skeleton'), el('div', 'skeleton'), el('div', 'skeleton'));
      wrap.querySelectorAll('.skeleton').forEach((s) => { s.style.height = '72px'; });
      try {
        const res = await apiFetch('/api/watchlist?userId=' + encodeURIComponent(userId));
        const data = await res.json();
        watchlistCodes.clear();
        for (const s of data.stocks || []) watchlistCodes.add(s.code);
        wrap.replaceChildren();
        if (!data.stocks || data.stocks.length === 0) {
          const empty = el('div', 'empty-state');
          empty.appendChild(el('div', 'icon', '📈'));
          empty.appendChild(el('div', 'title', '还没有自选股'));
          empty.appendChild(el('div', 'desc', '用上方搜索添加你持有的股票吧'));
          wrap.appendChild(empty);
          return;
        }
        for (const s of data.stocks) wrap.appendChild(stockCard(s));
      } catch (e) {
        wrap.replaceChildren(el('div', 'block-error', '加载失败：' + e.message));
      }
    }

    /* ---- 搜索 ---- */
    const searchInput = $('search-input');
    const searchResults = $('search-results');
    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const kw = searchInput.value.trim();
      if (!kw) { searchResults.classList.remove('open'); searchResults.replaceChildren(); return; }
      searchTimer = setTimeout(() => doSearch(kw), 300);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrap')) searchResults.classList.remove('open');
    });
    async function doSearch(kw) {
      try {
        const res = await apiFetch('/api/search?keyword=' + encodeURIComponent(kw));
        const data = await res.json();
        searchResults.replaceChildren();
        const list = data.results || [];
        if (list.length === 0) {
          searchResults.appendChild(el('div', 'block-error', '没有找到匹配的股票'));
        } else {
          for (const r of list) searchResults.appendChild(stockCard(r, { action: true }));
        }
        searchResults.classList.add('open');
      } catch { /* 搜索失败静默，不打断输入 */ }
    }

    /* ---- 自选增删 ---- */
    async function addWatch(code) {
      try {
        const res = await apiFetch('/api/watchlist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, code }),
        });
        const data = await res.json();
        if (data.ok) { watchlistCodes.add(code); return true; }
      } catch { /* fallthrough */ }
      alert('加入自选失败，请重试');
      return false;
    }
    async function removeWatch(code) {
      try {
        const res = await apiFetch('/api/watchlist', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, code }),
        });
        const data = await res.json();
        if (data.ok) { watchlistCodes.delete(code); return true; }
      } catch { /* fallthrough */ }
      alert('移除失败，请重试');
      return false;
    }

    /* ================= 详情视图 ================= */
    let currentCode = null;
    let currentName = '';
    let currentDays = 120;
    let detailData = null;
    let indicatorData = null;   // 技术指标（F5-1）；null=未加载/失败
    let indicatorError = null;
    let cachedBars = null;      // 日 K 数据缓存（指标后到时补画均线用）

    function goDetail(code, name) {
      history.pushState({}, '', '/stocks?code=' + encodeURIComponent(code));
      currentName = name || '';
      renderRoute();
    }
    $('back-link').onclick = (e) => { e.preventDefault(); history.pushState({}, '', '/stocks'); renderRoute(); };
    window.addEventListener('popstate', renderRoute);

    function renderRoute() {
      const code = new URLSearchParams(location.search).get('code');
      if (code && /^\d{6}$/.test(code)) {
        $('view-list').hidden = true;
        $('view-detail').hidden = false;
        $('header-sub').textContent = '个股详情';
        loadDetail(code);
      } else {
        $('view-detail').hidden = true;
        $('view-list').hidden = false;
        $('header-sub').textContent = '我的自选股';
        loadWatchlist();
      }
    }

    async function loadDetail(code) {
      currentCode = code;
      newsSort = 'hot';
      newsCache = {};
      $('d-code').textContent = code;
      $('d-name').textContent = currentName || code;
      renderWatchToggle();
      // 行情 + 资讯聚合
      $('d-price').textContent = '…';
      $('d-price').className = 'price';
      $('d-badge').replaceChildren();
      $('d-time').textContent = '';
      $('d-stats').replaceChildren();
      $('profile-card').hidden = true;
      $('fundflow-card').hidden = true;
      $('dividend-card').hidden = true;
      $('indicator-card').hidden = true;
      indicatorData = null; indicatorError = null; cachedBars = null;
      aiState = { code, text: '', error: '', loading: false }; // 切换股票时清掉上一只的分析结果
      renderAi();
      renderTab();
      try {
        const res = await apiFetch('/api/stocks/' + code);

    /* ---- 技术指标（F5-1）：独立于详情聚合拉取，失败只影响指标卡与均线叠加 ---- */
    async function loadIndicators() {
      try {
        const res = await apiFetch(`/api/stocks/${currentCode}/indicators?days=250`);
        const data = await res.json();
        if (currentCode !== new URLSearchParams(location.search).get('code')) return; // 已切换
        indicatorData = data.indicators || null;
        indicatorError = data.error || null;
      } catch (e) {
        indicatorData = null;
        indicatorError = e.message;
      }
      renderIndicators();
      redrawDailyChart(); // 日 K 已先画好：补画均线叠加
    }

    // 技术指标面板：均线/MACD/RSI/KDJ/BOLL/关键价位分组格 + 客观信号 chips。
    // 数据缺失整块隐藏，失败时卡内降级提示（同公司资料卡模式）。
    function renderIndicators() {
      const card = $('indicator-card');
      const box = $('d-indicators');
      box.replaceChildren();
      if (!indicatorData && !indicatorError) { card.hidden = true; return; }
      card.hidden = false;
      if (!indicatorData) {
        box.appendChild(el('div', 'block-error', '技术指标暂不可用：' + (indicatorError || '未知原因')));
        return;
      }
      const t = indicatorData.latest;
      const fmtN = (v, d) => (typeof v === 'number' && isFinite(v) ? v.toFixed(d) : '—');
      const fmtLv = (arr) => (arr && arr.length ? arr.map((v) => fmtPrice(v)).join(' / ') : '—');
      const groups = [
        ['均线', [['MA5', fmtPrice(t.ma.ma5)], ['MA10', fmtPrice(t.ma.ma10)], ['MA20', fmtPrice(t.ma.ma20)], ['MA60', fmtPrice(t.ma.ma60)]]],
        ['MACD（12,26,9）', [['DIF', fmtN(t.macd.dif, 3)], ['DEA', fmtN(t.macd.dea, 3)], ['MACD柱', fmtN(t.macd.macd, 3)]]],
        ['RSI', [['RSI6', fmtN(t.rsi.rsi6, 1)], ['RSI12', fmtN(t.rsi.rsi12, 1)], ['RSI24', fmtN(t.rsi.rsi24, 1)]]],
        ['KDJ（9,3,3）', [['K', fmtN(t.kdj.k, 2)], ['D', fmtN(t.kdj.d, 2)], ['J', fmtN(t.kdj.j, 2)]]],
        ['BOLL（20,2）', [['上轨', fmtPrice(t.boll.upper)], ['中轨', fmtPrice(t.boll.mid)], ['下轨', fmtPrice(t.boll.lower)]]],
        ['关键价位', [
          ['支撑位', fmtLv(indicatorData.keyLevels && indicatorData.keyLevels.support)],
          ['压力位', fmtLv(indicatorData.keyLevels && indicatorData.keyLevels.resistance)],
        ]],
      ];
      for (const [title, cells] of groups) {
        box.appendChild(el('div', 'ind-group', title));
        const grid = el('div', 'stat-grid');
        for (const [label, value] of cells) {
          const cell = el('div');
          cell.appendChild(el('div', 'label', label));
          cell.appendChild(el('div', 'value', value));
          grid.appendChild(cell);
        }
        box.appendChild(grid);
      }
      // 客观信号（仅描述当前状态，非买卖建议——故统一中性配色，不用红涨绿跌）
      const sigs = indicatorData.signals || [];
      if (sigs.length) {
        const list = el('div', 'sig-list');
        for (const s of sigs) list.appendChild(el('span', 'sig-chip', s.text));
        box.appendChild(list);
      }
      const srcLabel = indicatorData.source === 'sina' ? '新浪财经（降级源）' : '东方财富';
      box.appendChild(el('div', 'flow-note',
        `数据截至 ${indicatorData.asOf} · 数据源：${srcLabel} · 指标为历史行情的客观统计计算，信号仅描述当前状态。仅供参考，不构成投资建议。`));
    }

    /* ---- AI 多维分析（F5-2）：复用 /api/chat 链路（同 webchat），回复同步进该用户的会话历史 ---- */
    let aiState = { code: null, text: '', error: '', loading: false };
    $('ai-run').onclick = runAiAnalysis;

    async function runAiAnalysis() {
      if (aiState.loading || !currentCode) return;
      aiState = { code: currentCode, text: '', error: '', loading: true };
      renderAi();
      try {
        const res = await apiFetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId,
            message: '请多维度分析一下' + (currentName || '') + '（' + currentCode + '）',
          }),
        });
        const data = await res.json();
        if (aiState.code !== currentCode) return; // 已切换股票，丢弃迟到的结果
        aiState.loading = false;
        if (data.reply) aiState.text = data.reply;
        else aiState.error = data.error || '（无回复）';
      } catch (e) {
        if (aiState.code !== currentCode) return;
        aiState.loading = false;
        aiState.error = '请求失败：' + e.message;
      }
      renderAi();
    }

    function renderAi() {
      const box = $('ai-result');
      const btn = $('ai-run');
      box.replaceChildren();
      btn.disabled = aiState.loading;
      btn.textContent = aiState.loading ? '分析中…' : (aiState.text || aiState.error ? '重新生成' : '生成分析');
      if (aiState.loading) {
        box.appendChild(el('div', 'ai-hint ai-loading', 'AI 正在聚合多维数据并解读，通常需要十几秒'));
      } else if (aiState.error) {
        box.appendChild(el('div', 'block-error', aiState.error));
      } else if (aiState.text) {
        box.appendChild(el('div', '', aiState.text));
      } else {
        box.appendChild(el('div', 'ai-hint', '点击"生成分析"：AI 将综合行情估值、资金流、技术面、基本面与消息面给出客观解读'));
      }
    }

    // 近 N 日主力净流入柱状图（手写 SVG，无外链依赖）：零线上下，流入红、流出绿
    function drawFundFlowChart(box, items, sina) {
      const wrap = el('div', 'flow-chart-box');
      const tip = el('div', 'chart-tip');
      wrap.appendChild(tip);
      const W = 680, H = 150, padL = 52, padR = 12, padT = 10, padB = 22;
      const iw = W - padL - padR, ih = H - padT - padB;
      const vals = items.map((it) => (typeof it.mainNetInflow === 'number' ? it.mainNetInflow : 0));
      const maxAbs = Math.max(...vals.map(Math.abs), 1);
      const x = (i) => padL + (items.length === 1 ? iw / 2 : (i / (items.length - 1)) * iw);
      const y0 = padT + ih / 2;                       // 零线
      const y = (v) => y0 - (v / maxAbs) * (ih / 2);

      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.height = '150px';

      // 零线 + 上下极值标签
      const zero = document.createElementNS(ns, 'line');
      zero.setAttribute('x1', padL); zero.setAttribute('x2', W - padR);
      zero.setAttribute('y1', y0); zero.setAttribute('y2', y0);
      zero.setAttribute('stroke', '#e4e4e7');
      svg.appendChild(zero);
      for (const [v, gy] of [[maxAbs, y(maxAbs)], [-maxAbs, y(-maxAbs)]]) {
        const label = document.createElementNS(ns, 'text');
        label.setAttribute('x', padL - 8); label.setAttribute('y', gy + 4);
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('fill', '#a1a1aa'); label.setAttribute('font-size', '11');
        label.textContent = fmtFlow(v);
        svg.appendChild(label);
      }
      // X 轴首末日期
      for (const [i, anchor] of [[0, 'start'], [items.length - 1, 'end']]) {
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('x', x(i)); t.setAttribute('y', H - 6);
        t.setAttribute('text-anchor', anchor);
        t.setAttribute('fill', '#a1a1aa'); t.setAttribute('font-size', '11');
        t.textContent = items[i].date;
        svg.appendChild(t);
      }

      // 柱子：流入红、流出绿（与走势图红涨绿跌一致）
      const bw = Math.max(2, iw / items.length - 3);
      for (let i = 0; i < items.length; i++) {
        const v = vals[i];
        if (v === 0) continue;
        const rect = document.createElementNS(ns, 'rect');
        rect.setAttribute('x', x(i) - bw / 2);
        rect.setAttribute('y', Math.min(y0, y(v)));
        rect.setAttribute('width', bw);
        rect.setAttribute('height', Math.abs(y(v) - y0));
        rect.setAttribute('fill', v > 0 ? '#dc2626' : '#16a34a');
        rect.setAttribute('fill-opacity', '0.7');
        svg.appendChild(rect);
      }

      // hover：tooltip 显示当日各档数值
      const overlay = document.createElementNS(ns, 'rect');
      overlay.setAttribute('x', padL); overlay.setAttribute('y', padT);
      overlay.setAttribute('width', iw); overlay.setAttribute('height', ih);
      overlay.setAttribute('fill', 'transparent');
      overlay.addEventListener('mousemove', (e) => {
        const rect = svg.getBoundingClientRect();
        const mx = ((e.clientX - rect.left) / rect.width) * W;
        const i = Math.max(0, Math.min(items.length - 1, Math.round(((mx - padL) / iw) * (items.length - 1))));
        const it = items[i];
        tip.replaceChildren();
        tip.appendChild(el('div', '', it.date));
        tip.appendChild(el('div', '', (sina ? '净流入 ' : '主力净流入 ') + fmtFlow(it.mainNetInflow)));
        tip.appendChild(el('div', '', '超大单 ' + fmtFlow(it.superLargeNetInflow)));
        if (typeof it.largeNetInflow === 'number') tip.appendChild(el('div', '', '大单 ' + fmtFlow(it.largeNetInflow)));
        if (typeof it.mediumNetInflow === 'number') tip.appendChild(el('div', '', '中单 ' + fmtFlow(it.mediumNetInflow)));
        if (typeof it.smallNetInflow === 'number') tip.appendChild(el('div', '', '小单 ' + fmtFlow(it.smallNetInflow)));
        tip.style.display = 'block';
        const px = (x(i) / W) * rect.width;
        tip.style.left = Math.max(70, Math.min(rect.width - 70, px)) + 'px';
        tip.style.top = '0px';
      });
      overlay.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
      svg.appendChild(overlay);

      wrap.appendChild(svg);
      box.appendChild(wrap);
    }

    function renderWatchToggle() {
      const btn = $('watch-toggle');
      const inList = watchlistCodes.has(currentCode);
      btn.textContent = inList ? '移出自选' : '加入自选';
      btn.className = inList ? 'btn btn-ghost' : 'btn btn-primary';
      btn.onclick = async () => {
        btn.disabled = true;
        const ok = inList ? await removeWatch(currentCode) : await addWatch(currentCode);
        btn.disabled = false;
        if (ok) renderWatchToggle();
      };
    }

    /* ---- Tab：新闻 / 公告 / 财报 ---- */
    // 新闻排序：hot=东财相关度/热度序（默认），time=时间倒序；每种排序的结果按 code 缓存
    let newsSort = 'hot';
    let newsCache = {};

    function renderNewsList(box, items, err) {
      if (!items) { box.appendChild(el('div', 'block-error', '暂不可用：' + (err || '未知原因'))); return; }
      if (items.length === 0) { box.appendChild(el('div', 'block-error', '暂无内容')); return; }
      const list = el('div', 'tab-list');
      for (const it of items) {
        const row = el('div', 'tab-item');
        if (it.url) {
          const a = el('a', '', it.title);
          a.href = it.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
          row.appendChild(a);
        } else {
          row.appendChild(el('div', '', it.title));
        }
        const sub = [it.source, it.publishedAt].filter(Boolean).join(' · ');
        if (sub) row.appendChild(el('div', 'sub', sub));
        list.appendChild(row);
      }
      box.appendChild(list);
    }

    function renderNews(box) {
      // 排序切换 pill
      const pills = el('div', 'range-pills');
      pills.style.marginBottom = '12px';
      for (const [key, label] of [['hot', '热度'], ['time', '最新']]) {
        const b = el('button', newsSort === key ? 'active' : '', label);
        b.onclick = () => {
          if (newsSort === key) return;
          newsSort = key;
          renderTab();
        };
        pills.appendChild(b);
      }
      box.appendChild(pills);

      const cached = newsCache[newsSort];
      if (cached) { renderNewsList(box, cached.items, cached.err); return; }
      if (newsSort === 'hot' && detailData) {
        // 详情聚合里已带热度序新闻，直接用，不重复请求
        newsCache.hot = { items: detailData.news, err: detailData.newsError };
        renderNewsList(box, detailData.news, detailData.newsError);
        return;
      }
      const sk = el('div', 'skeleton'); sk.style.height = '120px';
      box.appendChild(sk);
      apiFetch(`/api/stocks/${currentCode}/news?sort=${newsSort}`)
        .then((r) => r.json())
        .then((d) => {
          newsCache[newsSort] = d.error ? { items: null, err: d.error } : { items: d.news, err: null };
          if (activeTab === 'news') renderTab();
        })
        .catch((e) => {
          newsCache[newsSort] = { items: null, err: e.message };
          if (activeTab === 'news') renderTab();
        });
    }

    // 财报金额展示格式化：新版数据源返回无单位原始数值（元），大额转 亿/万 便于阅读
    function fmtMoney(s) {
      const v = Number(String(s).replace(/[,\s元]/g, ''));
      if (!isFinite(v) || v === 0) return s;
      const sign = v < 0 ? '-' : '';
      const a = Math.abs(v);
      if (a >= 1e8) return `${sign}${(a / 1e8).toFixed(2)}亿`;
      if (a >= 1e4) return `${sign}${(a / 1e4).toFixed(2)}万`;
      return s;
    }

    let activeTab = 'news';
    $('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-tab]');
      if (!btn) return;
      activeTab = btn.dataset.tab;
      $('tabs').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
      renderTab();
    });

    function renderTab() {
      const box = $('tab-content');
      box.replaceChildren();
      if (!detailData) {
        const sk = el('div', 'skeleton'); sk.style.height = '120px';
        box.appendChild(sk);
        return;
      }
      if (activeTab === 'financials') return renderFinancials(box, detailData.financials, detailData.financialsError);
      if (activeTab === 'news') return renderNews(box);
      const items = detailData.announcements;
      const err = detailData.announcementsError;
      if (!items) { box.appendChild(el('div', 'block-error', '暂不可用：' + (err || '未知原因'))); return; }
      if (items.length === 0) { box.appendChild(el('div', 'block-error', '暂无内容')); return; }
      const list = el('div', 'tab-list');
      for (const it of items) {
        const row = el('div', 'tab-item');
        if (it.url) {
          const a = el('a', '', it.title);
          a.href = it.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
          row.appendChild(a);
        } else {
          row.appendChild(el('div', '', it.title));
        }
        const sub = [it.source, it.publishedAt].filter(Boolean).join(' · ');
        if (sub) row.appendChild(el('div', 'sub', sub));
        list.appendChild(row);
      }
      box.appendChild(list);
    }

    function renderFinancials(box, items, err) {
      if (!items) { box.appendChild(el('div', 'block-error', '暂不可用：' + (err || '未知原因'))); return; }
      if (items.length === 0) { box.appendChild(el('div', 'block-error', '暂无财报数据')); return; }
      const table = el('table', 'fin-table');
      const thead = el('thead');
      const hr = el('tr');
      for (const h of ['报告期', '营收', '净利润', 'ROE', '每股净资产']) hr.appendChild(el('th', '', h));
      thead.appendChild(hr);
      table.appendChild(thead);
      const tbody = el('tbody');
      for (const f of items) {
        const tr = el('tr');
        tr.appendChild(el('td', '', f.period || '—'));
        tr.appendChild(el('td', '', f.revenue ? fmtMoney(f.revenue) : '—'));
        tr.appendChild(el('td', '', f.netProfit ? fmtMoney(f.netProfit) : '—'));
        tr.appendChild(el('td', '', f.roe ? f.roe + '%' : '—'));
        tr.appendChild(el('td', '', f.netAssetsPerShare || '—'));
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      box.appendChild(table);
    }

    /* ================= 走势图（分时 / 日K，手写 SVG，无外链依赖） ================= */
    // chartMode：intraday=今日分时（F3-5，需 data-service）；daily=历史日 K（区间 pill 切换）
    let chartMode = 'intraday';

    $('mode-pills').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-mode]');
      if (!btn || btn.dataset.mode === chartMode) return;
      chartMode = btn.dataset.mode;
      $('mode-pills').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
      $('range-pills').hidden = chartMode !== 'daily';
      $('chart-title').textContent = chartMode === 'daily' ? '历史走势' : '分时走势';
      loadHistory();
    });

    $('range-pills').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-days]');
      if (!btn) return;
      currentDays = Number(btn.dataset.days);
      $('range-pills').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
      loadHistory();
    });

    function resetChartBox() {
      const box = $('chart-box');
      box.querySelectorAll('svg, .block-error, .skeleton, .flow-note').forEach((n) => n.remove());
      $('chart-tip').style.display = 'none';
      $('ma-legend').hidden = true;
      const sk = el('div', 'skeleton'); sk.style.height = '320px';
      box.appendChild(sk);
      return sk;
    }

    // 日 K 均线叠加（F5-1）：指标 series 按日期对齐到 bars，得逐 bar 的 {ma5..ma60}|null
    const MA_DEFS = [['ma5', '#f59e0b', 'MA5'], ['ma10', '#8b5cf6', 'MA10'], ['ma20', '#3b82f6', 'MA20'], ['ma60', '#71717a', 'MA60']];
    function maOverlayFor(bars) {
      if (!indicatorData || !indicatorData.series || !indicatorData.series.dates) return null;
      const s = indicatorData.series;
      const byDate = new Map();
      for (let i = 0; i < s.dates.length; i++) {
        byDate.set(s.dates[i], { ma5: s.ma5[i], ma10: s.ma10[i], ma20: s.ma20[i], ma60: s.ma60[i] });
      }
      const out = bars.map((b) => byDate.get(b.date) || null);
      return out.some((r) => r) ? out : null;
    }

    // 指标数据后到时重画日 K（补均线叠加）
    function redrawDailyChart() {
      if (chartMode !== 'daily' || !cachedBars) return;
      const box = $('chart-box');
      box.querySelectorAll('svg, .block-error, .skeleton, .flow-note').forEach((n) => n.remove());
      drawChart(box, cachedBars);
    }

    async function loadHistory() {
      if (chartMode === 'intraday') return loadIntraday();
      const sk = resetChartBox();
      const box = $('chart-box');
      try {
        const res = await apiFetch(`/api/stocks/${currentCode}/history?days=${currentDays}`);
        const data = await res.json();
        sk.remove();
        if (currentCode !== new URLSearchParams(location.search).get('code')) return;
        const bars = (data.bars || []).filter((b) => typeof b.close === 'number');
        if (bars.length < 2) {
          box.appendChild(el('div', 'block-error', '暂无历史数据（股票可能停牌或数据源不可用）'));
          return;
        }
        cachedBars = bars;
        drawChart(box, bars);
      } catch (e) {
        sk.remove();
        box.appendChild(el('div', 'block-error', '走势数据加载失败：' + e.message));
      }
    }

    /* ---- 分时（今日 1 分钟线，F3-5） ---- */
    async function loadIntraday() {
      const sk = resetChartBox();
      const box = $('chart-box');
      try {
        const res = await apiFetch(`/api/stocks/${currentCode}/intraday`);
        const data = await res.json();
        sk.remove();
        if (currentCode !== new URLSearchParams(location.search).get('code')) return;
        const intraday = data.intraday;
        if (!intraday || !intraday.points || intraday.points.length < 2) {
          box.appendChild(el('div', 'block-error', '分时数据暂不可用：' + (data.error || '最近交易日无分时数据')));
          return;
        }
        // 昨收参考线来自行情聚合（quote 块失败时退化为首日开盘价基准，不阻塞图表）
        const q = detailData && detailData.quote;
        const prevClose = q && typeof q.prevClose === 'number' && isFinite(q.prevClose) ? q.prevClose : null;
        drawIntraday(box, intraday, prevClose);
      } catch (e) {
        sk.remove();
        box.appendChild(el('div', 'block-error', '分时数据加载失败：' + e.message));
      }
    }

    function drawIntraday(box, intraday, prevClose) {
      const pts = intraday.points;
      const W = 680, H = 320, padL = 52, padR = 12, padT = 14, padB = 26;
      const iw = W - padL - padR;
      const priceB = 226;                // 价格区底
      const ih = priceB - padT;
      const volT = 238, volB = H - padB; // 成交量副图区域
      const prices = pts.map((p) => p.price);
      const avgs = pts.map((p) => p.avgPrice).filter((v) => typeof v === 'number' && isFinite(v));
      // 均价线与昨收纳入值域，避免被裁剪
      let min = Math.min(...prices, ...avgs), max = Math.max(...prices, ...avgs);
      if (typeof prevClose === 'number') { min = Math.min(min, prevClose); max = Math.max(max, prevClose); }
      if (min === max) { min *= 0.99; max *= 1.01; }
      const pad = (max - min) * 0.05; min -= pad; max += pad;
      const x = (i) => padL + (i / (pts.length - 1)) * iw;
      const y = (v) => padT + (1 - (v - min) / (max - min)) * ih;
      const vols = pts.map((p) => (typeof p.volume === 'number' && isFinite(p.volume) ? p.volume : 0));
      const vmax = Math.max(...vols);
      // 涨跌基准：昨收优先，缺失时退化为当序列首价
      const ref = typeof prevClose === 'number' ? prevClose : prices[0];
      const lineColor = prices[prices.length - 1] >= ref ? '#dc2626' : '#16a34a';

      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.height = '320px';

      // 渐变填充
      const defs = document.createElementNS(ns, 'defs');
      const grad = document.createElementNS(ns, 'linearGradient');
      grad.id = 'fill-grad-intra'; grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
      grad.setAttribute('x2', '0'); grad.setAttribute('y2', '1');
      const s1 = document.createElementNS(ns, 'stop');
      s1.setAttribute('offset', '0'); s1.setAttribute('stop-color', lineColor); s1.setAttribute('stop-opacity', '0.16');
      const s2 = document.createElementNS(ns, 'stop');
      s2.setAttribute('offset', '1'); s2.setAttribute('stop-color', lineColor); s2.setAttribute('stop-opacity', '0');
      grad.append(s1, s2); defs.appendChild(grad); svg.appendChild(defs);

      // 水平网格线 + 价格标签（4 条）
      for (let g = 0; g <= 3; g++) {
        const v = min + ((max - min) * g) / 3;
        const gy = y(v);
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', padL); line.setAttribute('x2', W - padR);
        line.setAttribute('y1', gy); line.setAttribute('y2', gy);
        line.setAttribute('stroke', '#e4e4e7'); line.setAttribute('stroke-dasharray', g === 0 || g === 3 ? '0' : '3 3');
        svg.appendChild(line);
        const label = document.createElementNS(ns, 'text');
        label.setAttribute('x', padL - 8); label.setAttribute('y', gy + 4);
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('fill', '#a1a1aa'); label.setAttribute('font-size', '11');
        label.textContent = v.toFixed(2);
        svg.appendChild(label);
      }

      // X 轴时间标签（首/中/末）
      for (const [i, anchor] of [[0, 'start'], [Math.floor((pts.length - 1) / 2), 'middle'], [pts.length - 1, 'end']]) {
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('x', x(i)); t.setAttribute('y', H - 8);
        t.setAttribute('text-anchor', anchor);
        t.setAttribute('fill', '#a1a1aa'); t.setAttribute('font-size', '11');
        t.textContent = pts[i].time;
        svg.appendChild(t);
      }

      // 昨收参考线（虚线）
      if (typeof prevClose === 'number') {
        const ry = y(prevClose);
        const rl = document.createElementNS(ns, 'line');
        rl.setAttribute('x1', padL); rl.setAttribute('x2', W - padR);
        rl.setAttribute('y1', ry); rl.setAttribute('y2', ry);
        rl.setAttribute('stroke', '#a1a1aa'); rl.setAttribute('stroke-dasharray', '4 4');
        svg.appendChild(rl);
      }

      // 价格折线 + 填充
      const linePts = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.price).toFixed(1)}`);
      const area = document.createElementNS(ns, 'path');
      area.setAttribute('d', `M${padL},${y(min)} L${linePts.join(' L')} L${W - padR},${y(min)} Z`);
      area.setAttribute('fill', 'url(#fill-grad-intra)');
      svg.appendChild(area);
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', `M${linePts.join(' L')}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', lineColor);
      path.setAttribute('stroke-width', '2');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(path);

      // 分时均价线（VWAP，琥珀色虚线；数据源无成交额列时不画）
      if (avgs.length > 0) {
        const avgPts = [];
        for (let i = 0; i < pts.length; i++) {
          if (typeof pts[i].avgPrice === 'number') avgPts.push(`${x(i).toFixed(1)},${y(pts[i].avgPrice).toFixed(1)}`);
        }
        const avgPath = document.createElementNS(ns, 'path');
        avgPath.setAttribute('d', `M${avgPts.join(' L')}`);
        avgPath.setAttribute('fill', 'none');
        avgPath.setAttribute('stroke', '#d97706');
        avgPath.setAttribute('stroke-width', '1.5');
        avgPath.setAttribute('stroke-dasharray', '5 3');
        avgPath.setAttribute('vector-effect', 'non-scaling-stroke');
        svg.appendChild(avgPath);
      }

      // 成交量副图：柱高按最大成交量归一，红/绿按该分钟相对前一分钟涨跌
      if (vmax > 0) {
        const bw = Math.max(1, iw / pts.length - 1);
        for (let i = 0; i < pts.length; i++) {
          if (vols[i] <= 0) continue;
          const bh = (vols[i] / vmax) * (volB - volT);
          const rect = document.createElementNS(ns, 'rect');
          rect.setAttribute('x', x(i) - bw / 2);
          rect.setAttribute('y', volB - bh);
          rect.setAttribute('width', bw);
          rect.setAttribute('height', bh);
          const base = i > 0 ? pts[i - 1].price : ref;
          rect.setAttribute('fill', pts[i].price >= base ? '#dc2626' : '#16a34a');
          rect.setAttribute('fill-opacity', '0.55');
          svg.appendChild(rect);
        }
      }

      // hover：竖线 + 圆点 + tooltip（竖线贯穿价格区与成交量副图）
      const vline = document.createElementNS(ns, 'line');
      vline.setAttribute('stroke', '#a1a1aa'); vline.setAttribute('stroke-dasharray', '3 3');
      vline.setAttribute('y1', padT); vline.setAttribute('y2', volB);
      vline.style.display = 'none';
      svg.appendChild(vline);
      const dot = document.createElementNS(ns, 'circle');
      dot.setAttribute('r', '4'); dot.setAttribute('fill', lineColor);
      dot.setAttribute('stroke', '#fff'); dot.setAttribute('stroke-width', '2');
      dot.style.display = 'none';
      svg.appendChild(dot);

      const tip = $('chart-tip');
      const overlay = document.createElementNS(ns, 'rect');
      overlay.setAttribute('x', padL); overlay.setAttribute('y', padT);
      overlay.setAttribute('width', iw); overlay.setAttribute('height', volB - padT);
      overlay.setAttribute('fill', 'transparent');
      overlay.addEventListener('mousemove', (e) => {
        const rect = svg.getBoundingClientRect();
        const mx = ((e.clientX - rect.left) / rect.width) * W;
        const i = Math.max(0, Math.min(pts.length - 1, Math.round(((mx - padL) / iw) * (pts.length - 1))));
        const p = pts[i];
        vline.setAttribute('x1', x(i)); vline.setAttribute('x2', x(i));
        vline.style.display = '';
        dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(p.price));
        dot.style.display = '';
        tip.replaceChildren();
        tip.appendChild(el('div', '', p.time));
        const pct = ref > 0 ? ((p.price - ref) / ref) * 100 : null;
        tip.appendChild(el('div', '', `价格 ${fmtPrice(p.price)}${pct != null ? '  ' + fmtPct(pct) : ''}`));
        if (typeof p.avgPrice === 'number') tip.appendChild(el('div', '', `均价 ${fmtPrice(p.avgPrice)}`));
        tip.appendChild(el('div', '', `成交量 ${fmtVol(p.volume)}`));
        tip.style.display = 'block';
        const px = (x(i) / W) * rect.width;
        const py = (y(p.price) / H) * rect.height;
        tip.style.left = Math.max(70, Math.min(rect.width - 70, px)) + 'px';
        tip.style.top = (py - 10) + 'px';
      });
      overlay.addEventListener('mouseleave', () => {
        vline.style.display = 'none'; dot.style.display = 'none'; tip.style.display = 'none';
      });
      svg.appendChild(overlay);

      box.appendChild(svg);
      const srcLabel = intraday.source === 'sina' ? '新浪财经（降级源）' : '东方财富';
      box.appendChild(el('div', 'flow-note', `数据日期 ${intraday.date}（最近交易日）· 数据源：${srcLabel}`));
    }

    function drawChart(box, bars) {
      // 布局：上部价格折线区 + 下部成交量副图（F3-3）
      const W = 680, H = 320, padL = 52, padR = 12, padT = 14, padB = 26;
      const iw = W - padL - padR;
      const priceB = 226;               // 价格区底
      const ih = priceB - padT;
      const volT = 238, volB = H - padB; // 成交量副图区域
      const closes = bars.map((b) => b.close);
      let min = Math.min(...closes), max = Math.max(...closes);
      // 均线叠加（F5-1）：MA 值纳入值域，避免被裁剪
      const mas = maOverlayFor(bars);
      if (mas) {
        for (const row of mas) {
          if (!row) continue;
          for (const [key] of MA_DEFS) {
            const v = row[key];
            if (typeof v === 'number' && isFinite(v)) { min = Math.min(min, v); max = Math.max(max, v); }
          }
        }
      }
      if (min === max) { min *= 0.99; max *= 1.01; }
      const pad = (max - min) * 0.08; min -= pad; max += pad;
      const x = (i) => padL + (bars.length === 1 ? iw / 2 : (i / (bars.length - 1)) * iw);
      const y = (v) => padT + (1 - (v - min) / (max - min)) * ih;
      const vols = bars.map((b) => (typeof b.volume === 'number' && isFinite(b.volume) ? b.volume : 0));
      const vmax = Math.max(...vols);

      const up = closes[closes.length - 1] >= closes[0];
      const lineColor = up ? '#dc2626' : '#16a34a';
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.height = '320px';

      // 渐变填充
      const defs = document.createElementNS(ns, 'defs');
      const grad = document.createElementNS(ns, 'linearGradient');
      grad.id = 'fill-grad'; grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
      grad.setAttribute('x2', '0'); grad.setAttribute('y2', '1');
      const s1 = document.createElementNS(ns, 'stop');
      s1.setAttribute('offset', '0'); s1.setAttribute('stop-color', lineColor); s1.setAttribute('stop-opacity', '0.16');
      const s2 = document.createElementNS(ns, 'stop');
      s2.setAttribute('offset', '1'); s2.setAttribute('stop-color', lineColor); s2.setAttribute('stop-opacity', '0');
      grad.append(s1, s2); defs.appendChild(grad); svg.appendChild(defs);

      // 水平网格线 + 价格标签（4 条）
      for (let g = 0; g <= 3; g++) {
        const v = min + ((max - min) * g) / 3;
        const gy = y(v);
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', padL); line.setAttribute('x2', W - padR);
        line.setAttribute('y1', gy); line.setAttribute('y2', gy);
        line.setAttribute('stroke', '#e4e4e7'); line.setAttribute('stroke-dasharray', g === 0 || g === 3 ? '0' : '3 3');
        svg.appendChild(line);
        const label = document.createElementNS(ns, 'text');
        label.setAttribute('x', padL - 8); label.setAttribute('y', gy + 4);
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('fill', '#a1a1aa'); label.setAttribute('font-size', '11');
        label.textContent = v.toFixed(2);
        svg.appendChild(label);
      }

      // X 轴首末日期
      for (const [i, anchor] of [[0, 'start'], [bars.length - 1, 'end']]) {
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('x', x(i)); t.setAttribute('y', H - 8);
        t.setAttribute('text-anchor', anchor);
        t.setAttribute('fill', '#a1a1aa'); t.setAttribute('font-size', '11');
        t.textContent = bars[i].date;
        svg.appendChild(t);
      }

      // 折线 + 填充
      const pts = bars.map((b, i) => `${x(i).toFixed(1)},${y(b.close).toFixed(1)}`);
      const area = document.createElementNS(ns, 'path');
      area.setAttribute('d', `M${padL},${y(min)} L${pts.join(' L')} L${W - padR},${y(min)} Z`);
      area.setAttribute('fill', 'url(#fill-grad)');
      svg.appendChild(area);
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', `M${pts.join(' L')}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', lineColor);
      path.setAttribute('stroke-width', '2');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(path);

      // 均线叠加折线（F5-1）：跳过 null（前导不足周期），细线不抢价格主线
      if (mas) {
        for (const [key, color] of MA_DEFS) {
          const ptsMa = [];
          for (let i = 0; i < bars.length; i++) {
            const row = mas[i];
            const v = row ? row[key] : null;
            if (typeof v === 'number' && isFinite(v)) ptsMa.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
          }
          if (ptsMa.length < 2) continue;
          const mp = document.createElementNS(ns, 'path');
          mp.setAttribute('d', `M${ptsMa.join(' L')}`);
          mp.setAttribute('fill', 'none');
          mp.setAttribute('stroke', color);
          mp.setAttribute('stroke-width', '1.2');
          mp.setAttribute('stroke-linejoin', 'round');
          mp.setAttribute('vector-effect', 'non-scaling-stroke');
          svg.appendChild(mp);
        }
        // 图例（chart-head 区）
        const legend = $('ma-legend');
        legend.replaceChildren();
        for (const [, color, label] of MA_DEFS) {
          const b = el('b', '', label);
          b.style.color = color;
          legend.appendChild(b);
        }
        legend.hidden = false;
      }

      // 成交量副图：柱高按最大成交量归一，红涨绿跌（收≥开为涨）
      if (vmax > 0) {
        const bw = Math.max(1, iw / bars.length - 1);
        for (let i = 0; i < bars.length; i++) {
          if (vols[i] <= 0) continue;
          const bh = (vols[i] / vmax) * (volB - volT);
          const rect = document.createElementNS(ns, 'rect');
          rect.setAttribute('x', x(i) - bw / 2);
          rect.setAttribute('y', volB - bh);
          rect.setAttribute('width', bw);
          rect.setAttribute('height', bh);
          rect.setAttribute('fill', bars[i].close >= bars[i].open ? '#dc2626' : '#16a34a');
          rect.setAttribute('fill-opacity', '0.55');
          svg.appendChild(rect);
        }
      }

      // hover：竖线 + 圆点 + tooltip（竖线贯穿价格区与成交量副图）
      const vline = document.createElementNS(ns, 'line');
      vline.setAttribute('stroke', '#a1a1aa'); vline.setAttribute('stroke-dasharray', '3 3');
      vline.setAttribute('y1', padT); vline.setAttribute('y2', volB);
      vline.style.display = 'none';
      svg.appendChild(vline);
      const dot = document.createElementNS(ns, 'circle');
      dot.setAttribute('r', '4'); dot.setAttribute('fill', lineColor);
      dot.setAttribute('stroke', '#fff'); dot.setAttribute('stroke-width', '2');
      dot.style.display = 'none';
      svg.appendChild(dot);

      const tip = $('chart-tip');
      const overlay = document.createElementNS(ns, 'rect');
      overlay.setAttribute('x', padL); overlay.setAttribute('y', padT);
      overlay.setAttribute('width', iw); overlay.setAttribute('height', volB - padT);
      overlay.setAttribute('fill', 'transparent');
      overlay.addEventListener('mousemove', (e) => {
        const rect = svg.getBoundingClientRect();
        const mx = ((e.clientX - rect.left) / rect.width) * W;
        const i = Math.max(0, Math.min(bars.length - 1, Math.round(((mx - padL) / iw) * (bars.length - 1))));
        const b = bars[i];
        vline.setAttribute('x1', x(i)); vline.setAttribute('x2', x(i));
        vline.style.display = '';
        dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(b.close));
        dot.style.display = '';
        tip.replaceChildren();
        tip.appendChild(el('div', '', b.date));
        const pct = fmtPct(b.changePct);
        tip.appendChild(el('div', '', `收盘 ${fmtPrice(b.close)}${pct ? '  ' + pct : ''}`));
        // 均线值（F5-1 叠加开启时）
        const maRow = mas && mas[i];
        if (maRow) {
          const parts = MA_DEFS.filter(([k]) => typeof maRow[k] === 'number')
            .map(([k, , label]) => `${label} ${maRow[k].toFixed(2)}`);
          if (parts.length) tip.appendChild(el('div', '', parts.join('  ')));
        }
        tip.appendChild(el('div', '', `成交量 ${fmtVol(b.volume)}`));
        // 成交额/换手率仅东财源提供（新浪降级源无此列，HistoryBar 可选字段）
        if (typeof b.amount === 'number') tip.appendChild(el('div', '', `成交额 ${fmtCap(b.amount)}`));
        if (typeof b.turnover === 'number') tip.appendChild(el('div', '', `换手率 ${b.turnover.toFixed(2)}%`));
        tip.style.display = 'block';
        const px = (x(i) / W) * rect.width;
        const py = (y(b.close) / H) * rect.height;
        tip.style.left = Math.max(70, Math.min(rect.width - 70, px)) + 'px';
        tip.style.top = (py - 10) + 'px';
      });
      overlay.addEventListener('mouseleave', () => {
        vline.style.display = 'none'; dot.style.display = 'none'; tip.style.display = 'none';
      });
      svg.appendChild(overlay);

      box.appendChild(svg);
    }

    /* ================= 启动 ================= */
    renderRoute();
  </script>
</body>
</html>
